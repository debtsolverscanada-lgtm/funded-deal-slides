<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Solver.ca</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<meta name="theme-color" content="#000000">
<style>
:root { --line: rgba(255,255,255,0.10); --fg: #fff; --muted: rgba(255,255,255,0.55); --danger: #e3a8a8; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: radial-gradient(800px 500px at 75% -10%, rgba(255,255,255,0.08), transparent 60%), #000; color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Plus Jakarta Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: grid; place-items: center; padding: 16px; }
form { background: linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.025)); backdrop-filter: blur(26px) saturate(150%); -webkit-backdrop-filter: blur(26px) saturate(150%); box-shadow: 0 1px 0 rgba(255,255,255,0.08) inset, 0 30px 80px rgba(0,0,0,0.6); border: 1px solid var(--line); border-radius: 28px; padding: 28px 26px; width: min(380px, 100%); display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.brand img { width: 34px; height: 34px; filter: grayscale(1) brightness(1.4); }
h1 { font-size: 24px; font-weight: 600; margin: 0; letter-spacing: -.025em; }
label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); font-weight: 500; }
input { font: inherit; color: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,0.05); }
input:focus { outline: none; border-color: rgba(255,255,255,0.35); box-shadow: 0 0 0 4px rgba(255,255,255,0.06); }
button { font: inherit; font-weight: 600; padding: 13px; border: 0; border-radius: 999px; background: #fff; color: #000; cursor: pointer; box-shadow: 0 0 28px rgba(255,255,255,0.2); }
button:disabled { opacity: .6; }
.err { color: var(--danger); font-size: 14px; min-height: 1.5em; margin: 0; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
</style>
</head>
<body>
<form id="f">
  <div class="brand"><img src="/icon.svg" alt=""><h1>Solver.ca</h1></div>
  <label>Email <input id="email" type="email" autocomplete="username" required></label>
  <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
  <p class="err" id="err" role="alert"></p>
  <button id="go">Sign in</button>
  <p class="note">Forgot your password? Ask an admin to set a new one.</p>
</form>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }) });
    if (r.ok) { location.href = '/'; return; }
    const d = await r.json().catch(() => ({}));
    err.textContent = d.error || 'Sign-in failed. Try again.';
  } catch (x) { err.textContent = 'Can’t reach the server. Check your connection.'; }
  go.disabled = false;
});
</script>
</body>
</html>
