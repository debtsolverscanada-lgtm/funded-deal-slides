<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Solver.ca</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solver">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root { --line: rgba(255,255,255,0.12); --fg: #fff; --muted: rgba(255,255,255,0.6); --danger: #ffb4b4; --n1: #3ef2ff; --n2: #ff4fd8; --glow: rgba(62,242,255,.55); color-scheme: dark; }
html[data-t="magenta"] { --n1: #ff4fd8; --n2: #8b5cff; --glow: rgba(255,79,216,.55); }
html[data-t="lime"] { --n1: #b6ff3e; --n2: #2dffb0; --glow: rgba(182,255,62,.5); }
html[data-t="classic"] { --n1: #ffffff; --n2: #bfc6ff; --glow: rgba(255,255,255,.5); }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: #030308; color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Plus Jakarta Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: grid; place-items: center; padding: 16px; overflow: hidden; }
@media (display-mode: standalone) { body { padding-top: env(safe-area-inset-top, 0px); } }

/* ---------- the world behind the card ---------- */
.world { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.aurora { position: absolute; inset: -30%; filter: blur(70px) saturate(140%); opacity: .55; }
.aurora i { position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%; mix-blend-mode: screen; animation: drift 18s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { background: radial-gradient(closest-side, var(--n1), transparent); top: 0; left: 10%; }
.aurora i:nth-child(2) { background: radial-gradient(closest-side, var(--n2), transparent); top: 20%; right: 0; animation-duration: 23s; animation-delay: -6s; }
.aurora i:nth-child(3) { background: radial-gradient(closest-side, #6d5bff, transparent); bottom: 0; left: 30%; animation-duration: 27s; animation-delay: -12s; opacity: .7; }
@keyframes drift { 0% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(8vw,-6vh,0) scale(1.15); } 100% { transform: translate3d(-6vw,5vh,0) scale(.9); } }
.floor { position: absolute; left: -50%; right: -50%; bottom: -10%; height: 70%; transform-origin: 50% 0; transform: perspective(420px) rotateX(72deg);
  background-image: linear-gradient(var(--n1) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--n1) 1.5px, transparent 1.5px); background-size: 64px 64px;
  -webkit-mask: linear-gradient(to bottom, transparent 0%, #000 35%, #000 100%); mask: linear-gradient(to bottom, transparent 0%, #000 35%, #000 100%);
  opacity: .32; animation: floor 2.4s linear infinite; filter: drop-shadow(0 0 6px var(--glow)); }
@keyframes floor { to { background-position: 0 64px, 0 0; } }
.horizon { position: absolute; left: 0; right: 0; top: 54%; height: 2px; background: linear-gradient(90deg, transparent, var(--n1), var(--n2), transparent); box-shadow: 0 0 30px 6px var(--glow); opacity: .6; }
canvas#coins { position: absolute; inset: 0; width: 100%; height: 100%; }
.vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.75) 100%); }

/* ---------- the card ---------- */
.stage { position: relative; perspective: 1100px; width: min(400px, 100%); z-index: 2; margin-top: 64px; }
.tilt { position: relative; transform-style: preserve-3d; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .5s cubic-bezier(.2,.9,.25,1.1); animation: flipin 1.1s cubic-bezier(.2,.9,.25,1.1) both; }
@keyframes flipin { from { opacity: 0; transform: rotateX(-38deg) rotateY(14deg) translateY(60px) scale(.88); } to { opacity: 1; } }
.edge { position: absolute; inset: -2px; border-radius: 30px; padding: 2px; background: conic-gradient(from var(--a, 0deg), transparent 0 40%, var(--n1) 55%, var(--n2) 70%, transparent 85%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: spin 4s linear infinite; filter: drop-shadow(0 0 10px var(--glow)); pointer-events: none; }
@property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@keyframes spin { to { --a: 360deg; } }
form { position: relative; max-height: calc(100vh - 120px); overflow-y: auto; background: linear-gradient(160deg, rgba(30,30,40,0.82), rgba(10,10,16,0.88)); backdrop-filter: blur(34px) saturate(160%); -webkit-backdrop-filter: blur(34px) saturate(160%); box-shadow: 0 1px 0 rgba(255,255,255,0.12) inset, 0 40px 100px rgba(0,0,0,0.7), 0 0 60px rgba(0,0,0,.4); border: 1px solid var(--line); border-radius: 28px; padding: 56px 26px 26px; display: flex; flex-direction: column; gap: 14px; overflow-x: hidden; }
form::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.14) 50%, transparent 65%); background-size: 260% 100%; background-position: var(--sx, 160%) 0; transition: background-position .4s; }
.tilt.shake { animation: shake .5s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-9px); } 40%, 60% { transform: translateX(9px); } }

.brand { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 8px; text-align: center; }
h1 { font-size: 40px; font-weight: 800; margin: 0; letter-spacing: -.045em; line-height: 1.05;
  background: linear-gradient(100deg, #fff 0%, var(--n1) 30%, #fff 50%, var(--n2) 72%, #fff 100%); background-size: 240% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 5s linear infinite; filter: drop-shadow(0 1px 0 rgba(255,255,255,.35)) drop-shadow(0 2px 0 rgba(120,120,160,.5)) drop-shadow(0 3px 0 rgba(70,70,110,.5)) drop-shadow(0 4px 0 rgba(40,40,70,.6)) drop-shadow(0 10px 18px var(--glow)); }
@keyframes shimmer { to { background-position: -240% 0; } }
.tag { color: var(--muted); font-size: 13px; letter-spacing: .02em; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
input { font: inherit; color: inherit; padding: 13px 15px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,255,255,0.06); transition: border-color .2s, box-shadow .25s, background .2s, transform .2s; }
input:focus { outline: none; border-color: var(--n1); background: rgba(255,255,255,0.09); box-shadow: 0 0 0 4px rgba(255,255,255,0.05), 0 0 22px var(--glow); transform: translateZ(0) scale(1.01); }
button { position: relative; overflow: hidden; font: inherit; font-weight: 700; font-size: 16px; padding: 14px; border: 0; border-radius: 999px; background: #fff; color: #000; cursor: pointer; box-shadow: 0 0 30px var(--glow), 0 10px 30px rgba(0,0,0,.4); transition: transform .2s cubic-bezier(.2,.9,.25,1.3), box-shadow .25s; }
button:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 0 46px var(--glow), 0 14px 34px rgba(0,0,0,.45); }
button:active { transform: scale(.97); }
button::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.9) 50%, transparent 70%); transform: translateX(-120%); animation: sweep 3.2s ease-in-out infinite 1.4s; mix-blend-mode: overlay; }
@keyframes sweep { 0%, 60% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
button:disabled { opacity: .7; }
button.loading { color: transparent; }
button.loading::before { content: ""; position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; margin: -10px; border-radius: 50%; border: 2.5px solid rgba(0,0,0,.2); border-top-color: #000; animation: rot .7s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.err { color: var(--danger); font-size: 14px; min-height: 1.5em; margin: 0; }
.note { color: var(--muted); font-size: 13px; margin: 0; text-align: center; }
.note a, #step-setup a { color: #fff; }
[hidden] { display: none !important; }
#step-pw, #step-code, #step-setup { display: flex; flex-direction: column; gap: 14px; }
h2 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.gbtn { display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; padding: 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); color: #fff; text-decoration: none; }
.gbtn svg { width: 18px; height: 18px; }
.qr { align-self: center; background: #fff; padding: 6px; border-radius: 14px; line-height: 0; }
.qr svg { width: min(220px, 64vw); height: auto; }
.key, .codes code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; letter-spacing: .05em; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,0.05); word-break: break-all; text-align: center; user-select: all; }
.codes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* ---------- Penny, perched on the card ---------- */
.penny { position: absolute; left: 50%; top: -78px; width: 104px; height: 120px; margin-left: -52px; transform: translateZ(70px); z-index: 3; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.penny svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 18px var(--glow)) drop-shadow(0 12px 14px rgba(0,0,0,.5)); animation: hover 3.4s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes hover { 50% { transform: translateY(-7px) rotate(-2deg); } }
.penny .paw { transition: transform .45s cubic-bezier(.2,.9,.25,1.3); }
.penny .paw.l { transform: translate(-6px, 42px); } .penny .paw.r { transform: translate(6px, 42px); }
.penny.cover .paw.l { transform: translate(2px, -2px) rotate(-8deg); } .penny.cover .paw.r { transform: translate(-2px, -2px) rotate(8deg); }
.penny .lid { transform: scaleY(0); transform-origin: center; transform-box: fill-box; transition: transform .12s; }
.penny.blink .lid { transform: scaleY(1); }
.penny .sad { opacity: 0; } .penny.oops .sad { opacity: 1; } .penny.oops .smile { opacity: 0; }
.penny.oops svg { animation: no .6s ease-in-out; }
@keyframes no { 20%, 60% { transform: rotate(-10deg); } 40%, 80% { transform: rotate(10deg); } }
.penny.yay svg { animation: yay .9s cubic-bezier(.2,.9,.25,1.2) 2; }
@keyframes yay { 0% { transform: translateY(0) scale(1); } 25% { transform: translateY(4px) scale(1.15, .85); } 55% { transform: translateY(-46px) scale(.9, 1.1) rotate(10deg); } 85% { transform: translateY(0) scale(1.08, .94); } }
.bubble { position: absolute; bottom: 104%; left: 50%; transform: translateX(-50%); white-space: nowrap; background: rgba(10,10,14,.95); border: 1px solid var(--n1); box-shadow: 0 0 22px var(--glow); color: #fff; font-size: 13px; padding: 7px 12px; border-radius: 13px; pointer-events: none; animation: say 2.6s ease forwards; }
@keyframes say { 0% { opacity: 0; transform: translate(-50%, 8px) scale(.85); } 12%, 84% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; } }
canvas#burst { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

@media (max-width: 520px) { h1 { font-size: 34px; } .stage { margin-top: 70px; } form { padding: 54px 20px 22px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .tilt { transform: none !important; } }
/* the coins and floor always stay behind the card (3D layers could poke through it) */
.world { z-index: 0; isolation: isolate; }
.stage { isolation: isolate; transform: translateZ(0); }
/* 16px fields: iPhone doesn't zoom the page when one is tapped */
input { font-size: 16px; }
/* small phones (iPhone SE): nothing in the card gets squashed; the page scrolls instead */
form > * { flex-shrink: 0; }
form { max-height: none; overflow-y: visible; }
body { min-height: 100dvh; height: auto; overflow-x: hidden; overflow-y: auto; grid-template-columns: minmax(0, 1fr); }
@media (max-height: 700px) {
  body { place-items: start center; padding-top: max(16px, env(safe-area-inset-top, 0px)); }
  .stage { margin-top: 124px; } /* room for Penny and her speech bubble above the card */
  .bubble { white-space: normal; width: max-content; max-width: min(240px, 70vw); text-align: center; }
}

/* cinematic background video (made with Grok Imagine), under the aurora and Penny */
.bgvid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .75; }
.world .aurora { opacity: .28; }
.motto { margin: -4px 0 14px; font-size: 13px; font-style: italic; letter-spacing: .01em; color: rgba(255,255,255,.62); text-align: center; }
@media (prefers-reduced-motion: reduce) { .bgvid { opacity: .55; } }
</style>
</head>
<body>
<div class="world" aria-hidden="true"><video class="bgvid" id="bgvid" muted loop playsinline preload="auto" poster="/media/login-bg.jpg" src="/media/login-bg.mp4"></video><div class="aurora"><i></i><i></i><i></i></div><div class="horizon"></div><div class="floor"></div><canvas id="coins"></canvas><div class="vignette"></div></div>
<div class="stage" id="stage">
<div class="tilt" id="tilt">
<div class="penny" id="penny" role="img" aria-label="Penny, the Solver.ca money pet">
  <svg viewBox="0 0 80 92" aria-hidden="true">
    <defs><radialGradient id="pg" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#d8dbe4"/><stop offset="1" stop-color="#8d92a3"/></radialGradient>
      <linearGradient id="pr" x1="0" x2="1"><stop offset="0" stop-color="var(--n1)"/><stop offset="1" stop-color="var(--n2)"/></linearGradient></defs>
    <path d="M14 30 Q10 18 18 16 Q22 22 22 27 Z" fill="#c9cdd8"/><path d="M66 30 Q70 18 62 16 Q58 22 58 27 Z" fill="#c9cdd8"/>
    <circle cx="40" cy="48" r="33" fill="url(#pg)" stroke="url(#pr)" stroke-width="2.5"/>
    <circle cx="40" cy="48" r="26" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1" stroke-dasharray="2 3"/>
    <g class="eye" data-x="29" data-y="41"><ellipse cx="29" cy="41" rx="5" ry="6" fill="#141418"/><circle class="pupil" cx="30.5" cy="39" r="1.8" fill="#fff"/><rect class="lid" x="23" y="34" width="12" height="13" rx="6" fill="#d3d7e1"/></g>
    <g class="eye" data-x="51" data-y="41"><ellipse cx="51" cy="41" rx="5" ry="6" fill="#141418"/><circle class="pupil" cx="52.5" cy="39" r="1.8" fill="#fff"/><rect class="lid" x="45" y="34" width="12" height="13" rx="6" fill="#d3d7e1"/></g>
    <ellipse cx="22" cy="50" rx="4.5" ry="2.6" fill="var(--n2)" opacity=".5"/><ellipse cx="58" cy="50" rx="4.5" ry="2.6" fill="var(--n2)" opacity=".5"/>
    <path class="smile" d="M35 51 Q40 56 45 51" fill="none" stroke="#141418" stroke-width="2" stroke-linecap="round"/>
    <path class="sad" d="M35 54 Q40 49 45 54" fill="none" stroke="#141418" stroke-width="2" stroke-linecap="round"/>
    <text x="40" y="71" text-anchor="middle" font-size="13" font-weight="800" font-family="-apple-system, system-ui, sans-serif" fill="#5d6274">$</text>
    <ellipse class="paw l" cx="27" cy="42" rx="9" ry="7.5" fill="#c3c8d4" stroke="rgba(0,0,0,.18)"/>
    <ellipse class="paw r" cx="53" cy="42" rx="9" ry="7.5" fill="#c3c8d4" stroke="rgba(0,0,0,.18)"/>
  </svg>
</div>
<div class="edge"></div>
<form id="f" novalidate>
  <div class="brand"><h1>Solver.ca</h1><span class="tag">The CRM that never shuts down</span></div>
  <p class="motto">“Summer 2019 and a million dollars after taxes.”</p>
  <div id="step-pw">
    <label>Email <input id="email" type="email" autocomplete="username"></label>
    <label>Password <input id="password" type="password" autocomplete="current-password"></label>
  </div>
  <div id="step-code" hidden>
    <p class="note">Enter the 6-digit code from your authenticator app. Lost your phone? Enter one of your backup codes instead.</p>
    <label>Code <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="9" placeholder="123456"></label>
  </div>
  <div id="step-setup" hidden></div>
  <p class="err" id="err" role="alert"></p>
  <button id="go">Sign in</button>
  <a class="gbtn" id="google" href="/api/auth/google/start" hidden><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#fff" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></svg>Sign in with Google</a>
  <p class="note" id="note">Forgot your password? Ask an admin to set a new one.</p>
</form>
</div>
</div>
<script>
// Sign-in page effects: coin field, 3D tilt, and Penny's reactions. Purely visual; the sign-in itself is below.
(() => {
  'use strict';
  try { const t = localStorage.getItem('fx-theme'); if (t && t !== 'aurora' && t !== 'cyan') document.documentElement.dataset.t = t; } catch (e) {}
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const tilt = $('tilt'), penny = $('penny'), form = $('f');
  let mx = 0, my = 0; // pointer, -1..1

  // ---- tumbling 3D coins ----
  const cv = $('coins'), g = cv.getContext('2d'); let W = 0, H = 0, dpr = 1, coins = [];
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function size() { dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function spawn(far) { return { x: (Math.random() - .5) * 2, y: (Math.random() - .5) * 2, z: far ? 1 : Math.random() * .9 + .1, r: Math.random() * Math.PI * 2, vr: (Math.random() - .5) * .08, vz: .0012 + Math.random() * .0022, hue: Math.random() < .5 ? 1 : 2 }; }
  size(); addEventListener('resize', size); for (let i = 0; i < (W < 600 ? 22 : 40); i++) coins.push(spawn(false));
  function coin(x, y, s, spin, alpha, edge) {
    const w = Math.max(1.5, Math.abs(Math.cos(spin)) * s), grd = g.createLinearGradient(x - w, y - s, x + w, y + s);
    grd.addColorStop(0, '#fff6c9'); grd.addColorStop(.45, '#f5c542'); grd.addColorStop(1, '#a8741a');
    g.globalAlpha = alpha; g.shadowColor = edge; g.shadowBlur = s * .9;
    g.beginPath(); g.ellipse(x, y, w, s, 0, 0, Math.PI * 2); g.fillStyle = grd; g.fill();
    g.shadowBlur = 0; g.lineWidth = Math.max(1, s * .1); g.strokeStyle = 'rgba(255,240,190,.75)'; g.stroke();
    if (Math.abs(Math.cos(spin)) > .45) { g.fillStyle = 'rgba(110,70,10,.85)'; g.font = `800 ${s * 1.1}px -apple-system, system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.save(); g.translate(x, y); g.scale(Math.cos(spin), 1); g.fillText('$', 0, s * .05); g.restore(); }
  }
  let px = 0, py = 0;
  function frame() {
    g.clearRect(0, 0, W, H); px += (mx - px) * .05; py += (my - py) * .05;
    const n1 = css('--n1') || '#3ef2ff', n2 = css('--n2') || '#ff4fd8';
    coins.sort((a, b) => b.z - a.z);
    for (const c of coins) {
      c.z -= c.vz; c.r += c.vr; if (c.z <= .05) Object.assign(c, spawn(true));
      const f = 1 / c.z, x = W / 2 + (c.x * W * .55 - px * 60 * (1 - c.z)) * f * .6, y = H / 2 + (c.y * H * .55 - py * 40 * (1 - c.z)) * f * .6;
      if (x < -60 || x > W + 60 || y < -60 || y > H + 60) { Object.assign(c, spawn(true)); continue; }
      coin(x, y, Math.min(42, 5 * f), c.r, Math.min(1, (1 - c.z) * 1.6) * .9, c.hue === 1 ? n1 : n2);
    }
    g.globalAlpha = 1; if (!reduce) requestAnimationFrame(frame);
  }
  frame();

  // ---- 3D tilt + light sweep + Penny's eyes ----
  function look(cx, cy) {
    const r = penny.getBoundingClientRect();
    penny.querySelectorAll('.eye').forEach(eye => {
      const ex = r.left + Number(eye.dataset.x) / 80 * r.width, ey = r.top + Number(eye.dataset.y) / 92 * r.height, a = Math.atan2(cy - ey, cx - ex), d = 2.3;
      const p = eye.querySelector('.pupil'); p.setAttribute('cx', (Number(eye.dataset.x) + 1.5 + Math.cos(a) * d).toFixed(1)); p.setAttribute('cy', (Number(eye.dataset.y) - 2 + Math.sin(a) * d).toFixed(1));
    });
  }
  function pointer(x, y) {
    mx = x / innerWidth * 2 - 1; my = y / innerHeight * 2 - 1;
    if (!reduce && !tilt.classList.contains('shake')) { tilt.style.setProperty('--rx', (-my * 9).toFixed(2) + 'deg'); tilt.style.setProperty('--ry', (mx * 12).toFixed(2) + 'deg'); }
    form.style.setProperty('--sx', (160 - (mx + 1) * 110).toFixed(0) + '%');
    if (!penny.classList.contains('cover')) look(x, y);
  }
  addEventListener('pointermove', e => pointer(e.clientX, e.clientY), { passive: true });
  addEventListener('deviceorientation', e => { if (e.gamma == null) return; pointer(innerWidth / 2 + e.gamma * 8, innerHeight / 2 + (e.beta - 45) * 6); }, { passive: true });
  // phones without a pointer: a slow idle sway so the card still feels alive
  if (!reduce && matchMedia('(hover: none)').matches) { let t = 0; setInterval(() => { t += .04; if (!tilt.classList.contains('shake')) { tilt.style.setProperty('--rx', (Math.sin(t) * 3).toFixed(2) + 'deg'); tilt.style.setProperty('--ry', (Math.cos(t * .8) * 4).toFixed(2) + 'deg'); } }, 60); }

  // ---- Penny reacts to the form ----
  const say = (t, ms) => { penny.querySelectorAll('.bubble').forEach(b => b.remove()); const b = document.createElement('div'); b.className = 'bubble'; b.textContent = t; if (ms) b.style.animationDuration = ms + 'ms'; penny.appendChild(b); setTimeout(() => b.remove(), ms || 2600); };
  setInterval(() => { if (penny.classList.contains('cover')) return; penny.classList.add('blink'); setTimeout(() => penny.classList.remove('blink'), 140); }, 3800);
  const field = el => { const r = el.getBoundingClientRect(); look(r.left + Math.min(r.width, 30 + (el.value || '').length * 8), r.top + r.height / 2); };
  document.addEventListener('focusin', e => {
    const el = e.target; if (el.tagName !== 'INPUT') return;
    if (el.type === 'password') { penny.classList.add('cover'); say('I’m not looking! 🙈'); }
    else { penny.classList.remove('cover'); field(el); }
  });
  document.addEventListener('focusout', e => { if (e.target.type === 'password') setTimeout(() => { if (document.activeElement.type !== 'password') penny.classList.remove('cover'); }, 50); });
  document.addEventListener('input', e => { if (e.target.tagName === 'INPUT' && e.target.type !== 'password') field(e.target); });
  const HI = ['Welcome back!', 'Let’s close some deals', 'Ready to make money?', 'Hi! I’m Penny'];
  setTimeout(() => say(HI[Math.floor(Math.random() * HI.length)], 3200), 900);
  penny.addEventListener('click', () => { penny.classList.remove('yay'); void penny.offsetWidth; penny.classList.add('yay'); setTimeout(() => penny.classList.remove('yay'), 1800); say(['Wheee!', 'Money moves!', 'You got this!', 'Hehe, that tickles'][Math.floor(Math.random() * 4)]); burst(penny, 24); });

  // ---- coin + confetti burst ----
  function burst(from, n) {
    if (reduce) return;
    const c = document.createElement('canvas'); c.id = 'burst'; document.body.appendChild(c); const x = c.getContext('2d'), d = Math.min(2, devicePixelRatio || 1);
    c.width = innerWidth * d; c.height = innerHeight * d; x.scale(d, d);
    const r = from.getBoundingClientRect(), ox = r.left + r.width / 2, oy = r.top + r.height / 2, cols = [css('--n1'), css('--n2'), '#ffffff', '#f5c542'];
    const ps = Array.from({ length: n }, (_, i) => { const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 9; return { x: ox, y: oy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, w: 5 + Math.random() * 6, c: cols[i % cols.length], coin: i % 4 === 3 }; });
    const t0 = performance.now();
    (function step(t) {
      const el = t - t0; x.clearRect(0, 0, innerWidth, innerHeight);
      for (const p of ps) { p.vy += .35; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.globalAlpha = Math.max(0, 1 - el / 1800); x.translate(p.x, p.y); x.rotate(p.r);
        if (p.coin) { x.fillStyle = '#f5c542'; x.beginPath(); x.ellipse(0, 0, p.w * .9 * Math.abs(Math.cos(p.r * 2)) + 1, p.w * .9, 0, 0, Math.PI * 2); x.fill(); } else { x.fillStyle = p.c; x.fillRect(-p.w / 2, -2, p.w, 4); } x.restore(); }
      if (el < 1800) requestAnimationFrame(step); else c.remove();
    })(t0);
  }

  // ---- hooks used by the sign-in code ----
  window.LoginFX = {
    ok() { penny.classList.remove('cover', 'oops'); penny.classList.add('yay'); say('Yay! Let’s go! 🎉', 1400); burst(penny, 70); tilt.style.setProperty('--rx', '0deg'); tilt.style.setProperty('--ry', '0deg'); return new Promise(r => setTimeout(r, reduce ? 0 : 900)); },
    fail() { $('go').classList.remove('loading'); penny.classList.remove('cover'); penny.classList.add('oops'); tilt.classList.remove('shake'); void tilt.offsetWidth; tilt.classList.add('shake'); say('Hmm, that’s not it…'); setTimeout(() => { penny.classList.remove('oops'); tilt.classList.remove('shake'); }, 1800); },
    step(s) { if (s === 'code') { penny.classList.remove('cover'); say('One more step: your code'); } },
  };
  document.addEventListener('submit', () => { const b = $('go'); b.classList.add('loading'); setTimeout(() => b.classList.remove('loading'), 1500); }, true);
})();
</script>
<script src="/qr.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const H = { 'Content-Type': 'application/json', 'X-Solver': '1' };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let step = 'pw', ticket = '', setup = null, codes = null;
  async function post(url, body) {
    const r = await fetch(url, { method: 'POST', headers: H, body: JSON.stringify(body || {}), credentials: 'same-origin' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'That didn’t work. Try again.');
    return d;
  }
  function show(next) {
    step = next;
    $('step-pw').hidden = step !== 'pw'; $('step-code').hidden = step !== 'code'; $('step-setup').hidden = step !== 'setup';
    $('google').hidden = step !== 'pw' || !window.__google;
    $('note').textContent = step === 'pw' ? 'Forgot your password? Ask an admin to set a new one.' : step === 'code' ? 'Wrong account? Reload this page to start over.' : '';
    $('go').textContent = step === 'pw' ? 'Sign in' : step === 'code' ? 'Verify' : codes ? 'Continue' : 'Turn on two-factor';
    if (step === 'code') setTimeout(() => $('code').focus(), 0);
    window.LoginFX && window.LoginFX.step(step);
  }
  function renderSetup() {
    const el = $('step-setup');
    if (codes) { el.innerHTML = `<h2>Save your backup codes</h2><p class="note">Each works once, in place of a code from your app, if you lose your phone. Save them somewhere safe now. They won’t be shown again.</p><div class="codes">${codes.map(c => `<code>${esc(c)}</code>`).join('')}</div>`; return; }
    if (!setup) { el.innerHTML = '<p class="note">Getting your setup code…</p>'; return; }
    let qr = ''; try { qr = window.KSQR ? KSQR.svg(setup.uri, { scale: 4 }) : ''; } catch (e) {}
    el.innerHTML = `<h2>Set up two-factor sign-in</h2>
      <p class="note">Your admin requires a code from an authenticator app (Google Authenticator, 1Password, Authy) each time you sign in. Scan this with the app:</p>
      <div class="qr">${qr}</div>
      <p class="note">Can’t scan? Add it by hand with this key (time-based, 6 digits):</p>
      <code class="key">${esc(setup.secret.replace(/(.{4})/g, '$1 ').trim())}</code>
      <p class="note"><a href="${esc(setup.uri)}">Open in an authenticator app on this device</a></p>
      <label>Then enter the 6-digit code it shows <input id="setup-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></label>
      <p class="note"><a href="#" id="signout">Sign out</a></p>`;
    $('signout').onclick = async e => { e.preventDefault(); try { await post('/api/logout'); } catch (x) {} location.href = '/login'; };
  }
  async function startSetup() {
    show('setup'); renderSetup();
    try { setup = await post('/api/2fa/setup'); renderSetup(); setTimeout(() => $('setup-code') && $('setup-code').focus(), 0); }
    catch (e) { $('err').textContent = e.message; if (/already on/i.test(e.message)) location.href = '/'; }
  }
  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    const go = $('go'), err = $('err');
    go.disabled = true; err.textContent = '';
    try {
      if (step === 'pw') {
        const d = await post('/api/login', { email: $('email').value, password: $('password').value });
        if (d.twofa) { ticket = d.ticket; show('code'); }
        else if (d.setup2fa) await startSetup();
        else { await window.LoginFX.ok(); location.href = '/'; return; }
      } else if (step === 'code') {
        const d = await post('/api/login/2fa', { ticket, code: $('code').value.trim() });
        if (d.usedBackup) { alert(`You used a backup code. ${d.backupLeft} left. Make new ones under Security once you’re in.`); }
        await window.LoginFX.ok(); location.href = '/'; return;
      } else if (step === 'setup') {
        if (codes) { location.href = '/'; return; }
        const d = await post('/api/2fa/enable', { code: ($('setup-code').value || '').trim() });
        codes = d.backupCodes; renderSetup(); show('setup');
      }
    } catch (x) {
      err.textContent = x.message || 'Can’t reach the server. Check your connection.'; window.LoginFX.fail();
      if (step === 'code' && /start again|took too long/i.test(err.textContent)) { show('pw'); }
    }
    go.disabled = false;
  });
  // where we came from: a Google sign-in, a forced two-factor setup, or an error
  const hash = new URLSearchParams(location.hash.slice(1)); history.replaceState(null, '', location.pathname + location.search);
  fetch('/api/auth/config').then(r => r.json()).then(c => { window.__google = !!c.google; show(step); }).catch(() => {});
  if (hash.get('error')) $('err').textContent = hash.get('error');
  if (hash.get('ok')) { location.href = '/'; return; }
  if (hash.get('twofa')) { ticket = hash.get('twofa'); show('code'); }
  else if (new URLSearchParams(location.search).get('setup')) startSetup();
  else show('pw');
})();
</script>

  if (m === 'off' || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
