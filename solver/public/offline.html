<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Solver.ca · offline</title><meta name="theme-color" content="#000000"><link rel="icon" href="/icon.svg">
<style>html,body{margin:0;height:100%;background:#000;color:#fff;font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}main{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px}img{width:72px;height:72px;border-radius:18px}h1{font-size:22px;margin:18px 0 6px}p{color:rgba(255,255,255,.65);margin:0 0 22px;max-width:320px}button{background:#fff;color:#000;border:0;border-radius:999px;padding:12px 22px;font:inherit;font-size:15px;font-weight:600;line-height:1;cursor:pointer}</style></head>
<body><main><div><img src="/icons/icon-192.png" alt=""><h1>You’re offline</h1><p>Solver.ca needs a connection to show your boards. Nothing you did was lost. It will reconnect on its own.</p><button onclick="location.href='/'">Try again</button></div></main>
<script>
// follow the saved theme (theme.js) so a Light/Beige user doesn't get a black page and status bar
(() => { let t = 'dark'; try { t = localStorage.getItem('ks-theme') || 'dark'; } catch (e) {}
  const c = { light: ['#f4f4f6', '#111'], beige: ['#efe3cf', '#2a2116'], grey: ['#3a3b40', '#fff'], maroon: ['#4a1020', '#fff'], blue: ['#102a5c', '#fff'] }[t];
  if (!c) return; document.querySelector('meta[name="theme-color"]').content = c[0];
  const s = document.documentElement.style; document.body.style.background = s.background = c[0]; document.body.style.color = c[1];
  const p = document.querySelector('p'); p.style.color = c[1]; p.style.opacity = '.7';
  const b = document.querySelector('button'); b.style.background = c[1]; b.style.color = c[0]; })();
// reconnect on its own: when the connection is back, check the server answers before leaving, and keep checking
let going = false;
async function retry() {
  if (going || !navigator.onLine) return;
  try { const r = await fetch('/healthz?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) { going = true; location.href = '/'; } } catch (e) {}
}
addEventListener('online', retry); setInterval(retry, 4000);
</script></body></html>
