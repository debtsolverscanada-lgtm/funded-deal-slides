<style>
/* Layout: a fixed board rail on the left, the working board on the right; collapses to one column on phones. */
:root {
  /* Glass on black: one deliberate dark look, so no light variant. */
  --bg: #000000;
  --surface: rgba(255, 255, 255, 0.045);
  --surface-2: rgba(255, 255, 255, 0.075);
  --solid: #0c0c0e;
  --line: rgba(255, 255, 255, 0.09);
  --line-2: rgba(255, 255, 255, 0.16);
  --fg: #ffffff;
  --muted: rgba(255, 255, 255, 0.52);
  --accent: #ffffff;
  --accent-fg: #000000;
  --accent-soft: rgba(255, 255, 255, 0.10);
  --warn-bg: rgba(255, 255, 255, 0.04);
  --warn-fg: rgba(255, 255, 255, 0.62);
  --danger: #e3a8a8;
  --shadow: 0 24px 70px rgba(0, 0, 0, 0.65);
  --glow: 0 0 0 1px rgba(255, 255, 255, 0.05), 0 10px 40px rgba(255, 255, 255, 0.035);
  --blur: blur(26px) saturate(150%);
  --r-lg: 22px; --r-md: 14px; --r-sm: 10px;
  --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-data: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px; padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 14px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.brand-mark svg { width: 18px; height: 18px; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: -.01em; }
.brand-tag { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.rail h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.board-list { display: flex; flex-direction: column; gap: 2px; }
.board-link { text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; display: flex; gap: 8px; align-items: center; }
.board-link:hover { background: var(--surface-2); }
.board-link[aria-current="true"] { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.board-link .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--accent); flex: none; }
.rail-input { width: 100%; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 7px; background: transparent; }
.rail-note { margin-top: auto; font-size: 12px; color: var(--muted); line-height: 1.5; }

.main { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.banner { background: var(--warn-bg); color: var(--warn-fg); font-size: 12.5px; padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.head { padding-block: 16px 10px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.head-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.board-title { font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: -.015em; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 0 4px; margin-left: -5px; min-width: 0; flex: 1 1 260px; text-wrap: balance; }
.board-title:hover { border-color: var(--line); }
.board-select { display: none; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); }
.tabs { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.tab { border: 0; background: none; padding: 6px 12px; border-radius: 6px; font-weight: 500; color: var(--muted); }
.tab[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.search { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); width: 200px; max-width: 100%; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--danger); }
.spacer { flex: 1; }
.kbd-select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2); }

.content { flex: 1; overflow: auto; padding-block: 18px 60px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.empty { max-width: 460px; margin: 60px auto; text-align: center; color: var(--muted); line-height: 1.6; }
.empty h3 { font-family: var(--f-display); color: var(--fg); font-size: 20px; margin: 0 0 6px; }

/* Table view */
.group { margin-bottom: 26px; }
.group-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.caret { border: 0; background: none; color: var(--gc); width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; transition: transform .15s; }
.caret[aria-expanded="false"] { transform: rotate(-90deg); }
.group-name { font-family: var(--f-display); font-weight: 600; font-size: 17px; color: var(--gc); border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 1px 4px; min-width: 60px; field-sizing: content; }
.group-name:hover { border-color: var(--line); }
.group-count { font-size: 12px; color: var(--muted); font-family: var(--f-data); }
.icon-btn { border: 0; background: none; color: var(--muted); padding: 4px 6px; border-radius: 5px; font-size: 12px; }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.tablewrap { overflow-x: auto; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); }
table.board { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
.board th, .board td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; height: 38px; text-align: left; vertical-align: middle; }
.board th:last-child, .board td:last-child { border-right: 0; }
.board th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); padding: 0 10px; white-space: nowrap; }
.board th button.col-head { border: 0; background: none; font-weight: 600; color: var(--muted); padding: 6px 0; display: flex; gap: 6px; align-items: center; width: 100%; }
.board th button.col-head:hover { color: var(--fg); }
.col-type { font-family: var(--f-data); font-size: 10px; opacity: .7; }
.board .name-cell { position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 250px; box-shadow: inset 4px 0 0 var(--gc); }
.board thead .name-cell { background: var(--surface-2); }
.name-wrap { display: flex; align-items: center; padding-left: 10px; gap: 4px; }
.cell-input { width: 100%; height: 37px; border: 1px solid transparent; background: transparent; padding: 0 10px; min-width: 0; }
.cell-input:hover { border-color: var(--line); }
.cell-input:focus { background: var(--surface-2); border-color: var(--accent); outline: none; }
.num-cell .cell-input { font-family: var(--f-data); text-align: right; font-variant-numeric: tabular-nums; }
td.currency { position: relative; }
td.currency::before { content: "$"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-family: var(--f-data); pointer-events: none; }
.open-btn { border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 11px; padding: 2px 7px; border-radius: 5px; opacity: 0; }
tr:hover .open-btn, .open-btn:focus-visible { opacity: 1; }
@media (hover: none) { .open-btn { opacity: 1; } }
.chip { width: 100%; height: 37px; border: 0; color: #fff; font-weight: 500; font-size: 13px; padding: 0 10px; text-shadow: 0 1px 0 rgba(0,0,0,.12); }
.chip.none { background: var(--surface-2); color: var(--muted); text-shadow: none; }
.chip:hover { filter: brightness(1.08); }
.w-status { width: 150px; } .w-text { width: 200px; } .w-person { width: 130px; } .w-date { width: 140px; } .w-phone { width: 140px; } .w-email { width: 210px; } .w-number { width: 140px; }
.add-row td { height: 36px; }
.add-row .cell-input { color: var(--muted); }
.sum-row td { height: 30px; background: var(--surface-2); border-bottom: 0; }
.sum-row .name-cell { background: var(--surface-2); }
.sumbar { display: flex; height: 16px; margin: 0 8px; border-radius: 3px; overflow: hidden; background: var(--line); }
.sumbar span { height: 100%; }
.sumnum { font-family: var(--f-data); font-size: 12px; text-align: right; padding: 0 10px; font-variant-numeric: tabular-nums; color: var(--muted); }
.add-group { margin-top: 4px; }

/* Kanban */
.kanban { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding-bottom: 12px; }
.lane { flex: 0 0 260px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; max-height: calc(100vh - 230px); }
.lane-head { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; border-top: 4px solid var(--lc); border-radius: 10px 10px 0 0; font-weight: 600; }
.lane-body { padding: 4px 8px 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 60px; }
.lane.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px; display: flex; flex-direction: column; gap: 6px; cursor: grab; text-align: left; }
.card:hover { border-color: var(--accent); }
.card-name { font-weight: 600; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }
.card-meta .amt { font-family: var(--f-data); color: var(--fg); }
.pill { display: inline-block; padding: 1px 7px; border-radius: 99px; color: #fff; font-size: 11px; }
.group-tag { font-size: 11px; color: var(--gc); font-weight: 600; }

/* Item drawer */
.scrim { position: fixed; inset: 0; background: rgba(5, 15, 12, .35); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); z-index: 21; box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer-head { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
.drawer-title { font-family: var(--f-display); font-size: 22px; font-weight: 700; border: 1px solid transparent; background: transparent; border-radius: 6px; width: 100%; padding: 2px 4px; margin-left: -5px; }
.drawer-title:hover { border-color: var(--line); }
.drawer-body { overflow-y: auto; padding: 16px 20px 30px; display: flex; flex-direction: column; gap: 22px; }
.drawer-body > * { flex-shrink: 0; }
.fields { display: grid; grid-template-columns: 130px minmax(0, 1fr); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.fields > div { border-bottom: 1px solid var(--line); min-height: 38px; display: flex; align-items: center; }
.fields > div:nth-last-child(-n+2) { border-bottom: 0; }
.f-label { padding: 0 12px; font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-right: 1px solid var(--line); }
.f-value { position: relative; }
.f-value .kbd-select { border: 0; background: transparent; width: 100%; height: 37px; border-radius: 0; }
.sec-title { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
.composer { display: flex; flex-direction: column; gap: 8px; }
.composer textarea { width: 100%; min-height: 76px; resize: vertical; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); }
.update { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.update + .update { margin-top: 8px; }
.u-meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; }
.u-meta b { color: var(--fg); font-weight: 600; }
.u-text { white-space: pre-wrap; line-height: 1.5; overflow-wrap: anywhere; }
.log { list-style: none; margin: 0; padding: 0; font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.log li { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; }
.log time { font-family: var(--f-data); font-size: 11px; }
.log .auto { color: var(--accent); }

/* Popover and modal */
.pop { position: fixed; z-index: 40; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 8px; width: 220px; display: flex; flex-direction: column; gap: 4px; max-height: 340px; overflow-y: auto; }
/* Monday-style table details */
.board th { text-align: center; }
.board th button.col-head { justify-content: center; }
.board thead th.name-cell button.col-head, .board thead th.name-cell { text-align: left; }
.board td.c-status, .board td.c-person, .board td.c-date { text-align: center; }
.board td.c-person .cell-input, .board td.c-date .cell-input { text-align: center; }
td.percent { position: relative; }
td.percent::after { content: "%"; position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--muted); font-family: var(--f-data); pointer-events: none; }
td.percent .cell-input { padding-right: 22px; }
.ro { padding: 0 10px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.board tbody tr:hover td { background: var(--surface-2); }
.board tbody tr:hover td.name-cell { background: var(--surface-2); }
.sub-toggle { white-space: nowrap; flex: none; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font-size: 11px; padding: 1px 6px; border-radius: 5px; font-family: var(--f-data); }
.sub-row > td { background: var(--surface-2); padding: 6px 10px 10px 34px !important; height: auto; }
.subtable { border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.subtable th, .subtable td { border: 1px solid var(--line); padding: 5px 10px; font-size: 12.5px; white-space: nowrap; height: 30px; }
.subtable th { background: var(--surface-2); color: var(--muted); font-weight: 600; }
.more-row td { height: 36px; }
.more-row button { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0 12px; height: 36px; }
.folder-name { font-size: 12px; color: var(--muted); padding: 8px 10px 2px; font-weight: 600; }
.whoami { display: flex; flex-direction: column; gap: 2px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-size: 12.5px; }
.whoami b { font-weight: 600; }
.role { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 700; }
.importer { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; display: flex; flex-direction: column; gap: 10px; }
.importer h3 { margin: 0; font-family: var(--f-display); font-size: 17px; }
.importer p { margin: 0; line-height: 1.5; }
.progress { height: 8px; background: var(--surface); border-radius: 99px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.sublist { display: flex; flex-direction: column; gap: 6px; }
.subcard { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.subcard .card-meta { gap: 10px; }
.ws-select { width: 100%; font-weight: 600; }
.people-cell { width: 100%; height: 37px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; gap: 0; padding: 0 8px; }
.people-cell:hover { background: var(--surface-2); }
.f-value .people-cell { justify-content: flex-start; gap: 8px; }
.av { width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: 10.5px; font-weight: 600; display: inline-grid; place-items: center; border: 2px solid var(--surface); margin-left: -6px; flex: none; }
.av:first-child { margin-left: 0; }
.pmore, .pempty, .pnames { font-size: 12px; color: var(--muted); margin-left: 4px; }
.pnames { color: var(--fg); font-size: 13px; }
.grip { cursor: grab; color: var(--muted); font-size: 12px; padding: 0 2px; letter-spacing: -2px; opacity: 0; user-select: none; }
tr:hover .grip { opacity: 1; }
.rowcheck { width: 15px; height: 15px; accent-color: var(--accent); flex: none; margin: 0 4px 0 2px; }
.board tr.sel td, .board tr.sel td.name-cell { background: var(--accent-soft); }
.board tr.drop-target td { box-shadow: inset 0 2px 0 var(--accent); }
.group-head.drop-target { outline: 2px dashed var(--accent); outline-offset: 2px; border-radius: 6px; }
.th-sort { color: var(--accent); font-size: 11px; }
.th-filter { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }
.board th.add-col { width: 44px; padding: 0; }
.board th.add-col button { width: 100%; height: 37px; border: 0; background: none; color: var(--muted); font-size: 18px; }
.board th.add-col button:hover { color: var(--fg); background: var(--surface); }
.pop-section { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; padding: 6px 4px 2px; }
.pop-btn { text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 6px; }
.pop-btn:hover { background: var(--surface-2); }
.pop-check { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; font-size: 13px; cursor: pointer; }
.pop-check:hover { background: var(--surface-2); }
.pop-check input { accent-color: var(--accent); }
.pop-check .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.pop-check .ct { margin-left: auto; color: var(--muted); font-family: var(--f-data); font-size: 11px; }
.bulkbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 25; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 12px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: calc(100% - 32px); }
.bulkbar .count { background: var(--accent); color: var(--accent-fg); border-radius: 7px; padding: 6px 10px; font-weight: 600; }
.drawer-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 20px; }
.drawer-tab { border: 0; background: none; padding: 10px 12px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.drawer-tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.drawer-actions { display: flex; gap: 6px; }
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.cal-head h3 { font-family: var(--f-display); margin: 0 8px 0 0; font-size: 20px; }
.calwrap { overflow-x: auto; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(110px, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--line); gap: 1px; min-width: 770px; }
.cal-dow { background: var(--surface-2); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 6px 8px; font-weight: 600; }
.cal-day { background: var(--surface); min-height: 112px; padding: 6px; display: flex; flex-direction: column; gap: 3px; }
.cal-day.out { background: var(--surface-2); }
.cal-day.today .cal-num { background: var(--accent); color: var(--accent-fg); border-radius: 99px; padding: 0 6px; }
.cal-num { font-family: var(--f-data); font-size: 11px; color: var(--muted); align-self: flex-start; }
.cal-list { display: flex; flex-direction: column; gap: 3px; overflow-y: auto; max-height: 150px; }
.cal-chip { border: 0; color: #fff; text-align: left; font-size: 11.5px; padding: 3px 6px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-chip.plain { background: var(--accent-soft); color: var(--fg); }
.cell-input[data-overdue] { color: var(--danger); font-weight: 600; }
.pop .chip { height: 32px; border-radius: 6px; }
.pop input { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); margin-top: 4px; }
.modal-wrap { position: fixed; inset: 0; z-index: 30; background: rgba(5, 15, 12, .4); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); width: min(620px, 100%); max-height: calc(100% - 32px); overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; }
.modal h3 { font-family: var(--f-display); font-size: 20px; margin: 0; }
.modal p { margin: 0; color: var(--muted); line-height: 1.5; }
.rule { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; flex-wrap: wrap; }
.rule-text { flex: 1 1 260px; line-height: 1.6; }
.rule-text .tok { font-weight: 600; }
.rule.off .rule-text { opacity: .5; }
.form-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.form-row label { font-size: 12.5px; color: var(--muted); }
.field-input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2); min-width: 0; }
.toggle { border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; font-size: 12px; background: var(--surface-2); }
.toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }

.toasts { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.toast { background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow); }

@media (max-width: 780px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .board-select { display: block; }
  .board-title { font-size: 21px; flex-basis: 100%; }
  .search { width: 100%; }
  .lane { flex-basis: 240px; max-height: none; }
  .fields { grid-template-columns: 110px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
body { margin: 0; } [hidden] { display: none !important; }

/* ================= Glass theme ================= */
body { background: radial-gradient(900px 520px at 78% -8%, rgba(255,255,255,0.075), transparent 62%), radial-gradient(700px 500px at -10% 110%, rgba(255,255,255,0.04), transparent 60%), #000; background-attachment: fixed; -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; }
::selection { background: rgba(255,255,255,0.22); }
.rail { background: rgba(255,255,255,0.025); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border-right: 1px solid var(--line); }
.brand-mark { background: rgba(255,255,255,0.10); border: 1px solid var(--line-2); box-shadow: var(--glow); border-radius: 11px; }
.brand-mark svg { stroke: #fff; }
.brand-name { font-weight: 600; letter-spacing: -0.02em; }
.board-link { border-radius: 12px; color: rgba(255,255,255,0.78); }
.board-link:hover { background: rgba(255,255,255,0.05); }
.board-link[aria-current="true"] { background: rgba(255,255,255,0.10); color: #fff; box-shadow: inset 0 0 0 1px var(--line); }
.board-link .dot { background: rgba(255,255,255,0.35); border-radius: 50%; width: 6px; height: 6px; }
.board-link[aria-current="true"] .dot { background: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.7); }
.whoami { background: var(--surface); border-color: var(--line); border-radius: var(--r-md); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
.role { color: var(--muted); }
.banner { background: transparent; color: var(--muted); border-bottom: 1px solid var(--line); font-size: 12px; }
.head { background: transparent; border-bottom: 1px solid var(--line); }
.board-title { font-weight: 600; letter-spacing: -0.025em; }
.tabs { background: var(--surface); border-color: var(--line); border-radius: 999px; padding: 3px; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
.tab { border-radius: 999px; }
.tab[aria-pressed="true"] { background: rgba(255,255,255,0.14); color: #fff; box-shadow: inset 0 0 0 1px var(--line-2), 0 0 18px rgba(255,255,255,0.06); }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; color: #fff; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); transition: background .15s, border-color .15s; }
.btn:hover { background: rgba(255,255,255,0.10); border-color: var(--line-2); }
.btn.primary { background: #fff; color: #000; border-color: #fff; box-shadow: 0 0 24px rgba(255,255,255,0.18); font-weight: 600; }
.btn.primary:hover { filter: none; background: rgba(255,255,255,0.88); }
.btn.danger { color: var(--danger); }
.search, .kbd-select, .field-input, .rail-input, .pop input, .composer textarea { background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 12px; color: #fff; }
.search::placeholder, .rail-input::placeholder, .field-input::placeholder, textarea::placeholder, .cell-input::placeholder { color: rgba(255,255,255,0.38); }
.rail-input { border-style: solid; }
.group-name { color: #fff; font-weight: 600; letter-spacing: -0.015em; }
.caret { color: var(--muted); }
.group-count { color: var(--muted); }
.tablewrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); box-shadow: var(--glow); }
.board th, .board td { border-color: rgba(255,255,255,0.06); }
.board th { background: rgba(255,255,255,0.025); color: var(--muted); font-weight: 500; letter-spacing: 0.01em; }
.board th button.col-head { color: var(--muted); font-weight: 500; }
.board .name-cell { background: var(--solid); box-shadow: inset 2px 0 0 color-mix(in srgb, var(--gc) 55%, #000); }
.board thead .name-cell { background: #101012; }
.board tbody tr:hover td { background: rgba(255,255,255,0.035); }
.board tbody tr:hover td.name-cell { background: #131315; }
.board tr.sel td, .board tr.sel td.name-cell { background: rgba(255,255,255,0.08); }
.sum-row td, .sum-row .name-cell { background: rgba(255,255,255,0.02); }
.sumbar { background: rgba(255,255,255,0.08); border-radius: 99px; height: 8px; }
.sumbar span, .pop-check .sw { filter: saturate(0.5) brightness(1.05); }
.cell-input:focus { background: rgba(255,255,255,0.06); border-color: var(--line-2); }
.open-btn { background: rgba(255,255,255,0.06); border-color: var(--line); color: #fff; border-radius: 999px; }
.sub-toggle { background: rgba(255,255,255,0.06); border-color: var(--line); color: var(--muted); border-radius: 999px; }
.rowcheck { accent-color: #fff; }
.th-sort { color: #fff; }
.th-filter { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.8); }
td.currency::before, td.percent::after { color: var(--muted); }
.cell-input[data-overdue] { color: #f0c6c6; }
/* status chips: frosted pill with a soft, muted colour dot */
.chip { --c: transparent; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); color: #fff; border-radius: 999px; height: 28px; width: calc(100% - 12px); margin: 0 6px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-weight: 500; font-size: 12.5px; text-shadow: none; white-space: nowrap; overflow: hidden; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); filter: saturate(0.55) brightness(1.15); box-shadow: 0 0 10px var(--c); flex: none; }
.chip:not([style*="--c"])::before { display: none; }
.chip:hover { filter: none; background: rgba(255,255,255,0.11); }
.chip.none { background: transparent; border-color: transparent; color: rgba(255,255,255,0.3); }
.f-value .chip { width: auto; justify-content: flex-start; padding: 0 12px; }
.pop .chip { width: 100%; margin: 0; height: 34px; border-radius: 12px; justify-content: flex-start; padding: 0 12px; }
.pill { --c: transparent; background: rgba(255,255,255,0.08); border: 1px solid var(--line); color: #fff; display: inline-flex; align-items: center; gap: 6px; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); filter: saturate(0.55) brightness(1.15); flex: none; }
.pill:not([style*="--c"])::before { display: none; }
.subtable { background: transparent; border-color: var(--line); border-radius: 12px; }
.subtable th, .subtable td { border-color: rgba(255,255,255,0.06); }
.subtable th { background: rgba(255,255,255,0.03); }
.sub-row > td { background: rgba(255,255,255,0.015); }
.av { background: rgba(255,255,255,0.14) !important; color: #fff; border: 1px solid rgba(255,255,255,0.18); font-weight: 600; }
.people-cell:hover { background: rgba(255,255,255,0.04); }
/* kanban */
.lane { background: var(--surface); border-color: var(--line); border-radius: var(--r-lg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
.lane-head { border-top: 0; border-radius: var(--r-lg) var(--r-lg) 0 0; display: flex; gap: 8px; }
.lane-head span:first-child::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 8px; background: var(--lc); filter: saturate(0.55) brightness(1.15); box-shadow: 0 0 10px var(--lc); vertical-align: 1px; }
.card { background: rgba(255,255,255,0.05); border-color: var(--line); border-radius: var(--r-md); }
.card:hover { border-color: var(--line-2); background: rgba(255,255,255,0.08); }
.group-tag { color: var(--muted); }
/* calendar */
.cal { background: var(--line); border-color: var(--line); border-radius: var(--r-lg); }
.cal-dow { background: #0d0d0f; }
.cal-day { background: #070708; }
.cal-day.out { background: #040405; }
.cal-day.today .cal-num { background: #fff; color: #000; }
.cal-chip { --c: transparent; background: rgba(255,255,255,0.07); color: #fff; border: 1px solid var(--line); border-radius: 8px; display: flex; align-items: center; gap: 6px; }
.cal-chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); filter: saturate(0.55) brightness(1.15); flex: none; }
.cal-chip:not([style*="--c"])::before { display: none; }
.cal-chip.plain { background: rgba(255,255,255,0.05); }
/* overlays */
.scrim, .modal-wrap { background: rgba(0,0,0,0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.drawer { background: rgba(14,14,16,0.78); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border-left: 1px solid var(--line); border-radius: var(--r-lg) 0 0 var(--r-lg); }
.drawer-head, .drawer-tabs { border-color: var(--line); }
.drawer-title { font-weight: 600; letter-spacing: -0.02em; }
.drawer-tab[aria-selected="true"] { border-bottom-color: #fff; }
.fields { border-color: var(--line); border-radius: var(--r-md); background: rgba(255,255,255,0.02); }
.fields > div { border-color: rgba(255,255,255,0.06); }
.f-label { background: rgba(255,255,255,0.025); border-color: rgba(255,255,255,0.06); }
.update, .subcard, .rule { background: rgba(255,255,255,0.035); border-color: var(--line); border-radius: var(--r-md); }
.log .auto { color: #fff; }
.modal { background: rgba(16,16,18,0.82); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); }
.modal h3, .empty h3 { font-weight: 600; letter-spacing: -0.02em; }
.pop { background: rgba(18,18,20,0.84); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border-color: var(--line); border-radius: 18px; }
.pop-btn:hover, .pop-check:hover { background: rgba(255,255,255,0.07); }
.bulkbar { background: rgba(18,18,20,0.82); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border-color: var(--line); border-radius: 20px; }
.bulkbar .count { background: #fff; color: #000; border-radius: 999px; }
.toggle { background: rgba(255,255,255,0.05); border-color: var(--line); }
.toggle[aria-pressed="true"] { background: rgba(255,255,255,0.14); border-color: var(--line-2); }
.toast { background: rgba(255,255,255,0.92); color: #000; border-radius: 999px; }
.importer { background: var(--surface); border-color: var(--line); }
.progress span { background: #fff; }

      if (ev.type === 'value' && r.trigger === 'status' && r.col === ev.col) return r.value == null || r.value === '' ? true : String(r.value) === String(ev.value);
      if (ev.type === 'value' && r.trigger === 'column' && r.col === ev.col) return r.value == null || r.value === '' || String(r.value) === String(ev.value);

      if (ev.type === 'moved_board' && r.trigger === 'moved_board') return true;

    for (const x of after) {

      if (x.kind === 'update' && x.text) { item.updates = [...(item.updates || []), { at: now(), by: 'automation', byName: 'Automation', text: x.text }]; const p = 'boards/' + b.id + '/items/' + item.id; write(p, () => S.db.doc(p).update({ updates: item.updates }), { guest: true }); }

  function moveItemToBoard(b, item, targetBoardId, groupId, why, removeHere = true, map = null, hop = 1) {
    const tb = S.boards.find(x => x.id === targetBoardId); if (!tb) { toast('The board this automation moves items to isn’t in Solver.ca.'); return; }
    const g = (groupId === '__top__' ? tb.groups[0] : tb.groups.find(x => x.id === groupId)) || tb.groups[0];

      if (sc && sc.type === 'status') { const name = (labelOf(sc, v) || {}).label; const tl = name && (tc.labels || []).find(l => l.label.toLowerCase() === name.toLowerCase()); if (!tl) return; v = tl.id; }
      values[tc.id] = v; });
    const newId = removeHere ? item.id : rid('i');
    const data = { ...item, values, group: g ? g.id : '', pos: Date.now(), activity: [{ at: now(), by: 'automation', text: `${why || 'Automation'} ${removeHere ? 'moved' : 'copied'} this here from “${b.name}”` }, ...(removeHere ? (item.activity || []) : [])].slice(0, 40) };

    Object.entries(S.filters).forEach(([cid, vals]) => { if (vals && vals.length) list = list.filter(i => vals.includes(String((i.values || {})[cid] ?? ''))); });
    const sortBy = S.sort || (view && view.sort);
    if (sortBy && b) {
      const c = sortBy.col === 'name' ? null : b.columns.find(x => x.id === sortBy.col);
      const key = i => {
        if (!c) return (i.name || '').toLowerCase();
        const v = (i.values || {})[c.id];
        if (v == null || v === '') return null;
        if (c.type === 'status') return (c.labels || []).findIndex(l => l.id === v);
        if (c.type === 'number') return Number(v);
        return String(v).toLowerCase();
      };
      const d = sortBy.dir === 'desc' ? -1 : 1;
      list.sort((x, y) => { const a = key(x), z = key(y); if (a === null && z === null) return 0; if (a === null) return 1; if (z === null) return -1; return (a < z ? -1 : a > z ? 1 : 0) * d; });
    }
    return list;
  }

  function cellEditor(col, item, inDrawer) {
    { const h = fx('cell', col, item, inDrawer); if (h !== undefined) return h; }
    const v = (item.values || {})[col.id] ?? '';
    const canEd = colEditable(col), ro = canEd ? '' : 'readonly';
    const base = `class="cell-input" data-edit="value" data-item="${esc(item.id)}" data-col="${esc(col.id)}" aria-label="${esc(col.title)}" ${ro}`;
    { const x = window.SolverExt && SolverExt.cell(col, item, inDrawer); if (x != null) return x; } // AI and Doc columns (extras.js, editor.js)
    if (col.type === 'formula') { const r = formulaResult(board(), item, col); const t = r.error ? '⚠' : KSFormula.format(r.value); return `<div class="ro fx" title="${esc(r.error ? 'Formula problem: ' + r.error : col.formula)}">${esc(t)}</div>`; }
    if (col.type === 'item_id') return `<div class="ro">${esc(item.mondayId || item.id)}</div>`;
    if (col.type === 'created') return `<div class="ro">${esc(fmtTime(item.createdAt))}</div>`;
    if (col.type === 'button') return `<button class="col-btn" data-act="col-button" data-item="${esc(item.id)}" data-col="${esc(col.id)}">${esc(col.title)}</button>`;
    if (col.type === 'checkbox') return `<label class="cb"><input type="checkbox" data-edit="check" data-item="${esc(item.id)}" data-col="${esc(col.id)}" ${v ? 'checked' : ''} ${canEd ? '' : 'disabled'} aria-label="${esc(col.title)}"></label>`;
    if (col.type === 'dropdown') { const vals = splitPeople(v); return `<button class="people-cell dd-cell" data-act="dropdown" data-item="${esc(item.id)}" data-col="${esc(col.id)}" ${canEd ? '' : 'disabled'}>${vals.length ? vals.map(x => `<span class="pill">${esc(x)}</span>`).join('') : `<span class="pempty">${inDrawer ? 'Choose' : ''}</span>`}</button>`; }
    if (col.type === 'link') { const lp = linkParts(v); return `<div class="link-cell"><input type="text" ${base} value="${esc(v)}" placeholder="${inDrawer ? 'https://' : ''}">${lp.url ? `<a href="${esc(lp.url)}" target="_blank" rel="noopener" aria-label="Open link">↗</a>` : ''}</div>`; }
    if (isFileCol(col)) {
      const at = `data-item="${esc(item.id)}" data-col="${esc(col.id)}"`;
      const chips = fileList(v).map((f, k) => `<span class="file-chip"><a href="${esc(f.url)}" target="_blank" rel="noopener" title="${esc(f.name)}" ${String(f.url).startsWith('/api/files/') ? 'download' : ''}>${esc(f.name)}</a>${canEd && inDrawer ? `<button class="icon-btn" data-act="file-remove" ${at} data-k="${k}" aria-label="Remove ${esc(f.name)}" title="Remove">×</button>` : ''}</span>`).join('');
      return `<div class="file-cell">${chips}${canEd ? `<button class="icon-btn file-add" data-act="file-add" ${at} title="Add file" aria-label="Add file to ${esc(col.title)}">${inDrawer || !chips ? '+ Add file' : '+'}</button>` : ''}</div>`;
    }
    if (col.readonly) return `<div class="ro" title="${esc(v)}">${esc(v)}</div>`;
    if (col.long && inDrawer) return `<textarea ${base} rows="3" style="height:auto;padding:8px 10px;resize:vertical">${esc(v)}</textarea>`;
    switch (col.type) {
      case 'status': {
        const l = labelOf(col, v);
        return `<button class="chip ${l ? '' : 'none'}" style="${l ? '--c:' + esc(l.color) : ''}" title="${esc(l && l.desc || '')}" data-act="status" data-item="${esc(item.id)}" data-col="${esc(col.id)}" ${canEd ? '' : 'aria-disabled="true"'}>${l ? esc(l.label) : inDrawer && canEd ? 'Set ' + esc(col.title.toLowerCase()) : ''}</button>`;
      }
      case 'date': return canEd ? `<input type="date" ${base} value="${esc(v)}" ${v && v < ymd(new Date()) && /follow|due|deadline|next|callback/i.test(col.title) ? 'data-overdue title="Overdue"' : ''}>` : `<input type="text" ${base} value="${esc(v)}">`;
      case 'number': return `<input type="text" inputmode="decimal" ${base} value="${col.format === 'currency' ? esc(fmtMoney(v)) : esc(v)}" style="${col.format === 'currency' ? 'padding-left:20px' : ''}">`;
      case 'person': {
        const ps = splitPeople(v);
        const avs = ps.slice(0, 3).map(n => `<span class="av" style="background:${hue(n)}" title="${esc(n)}">${esc(initials(n))}</span>`).join('');
        return `<button class="people-cell" data-act="person" data-item="${esc(item.id)}" data-col="${esc(col.id)}" aria-label="${esc(col.title)}: ${esc(ps.join(', ') || 'nobody')}" ${canEd ? '' : 'disabled'}>${ps.length ? avs + (inDrawer ? `<span class="pnames">${esc(ps.join(', '))}</span>` : ps.length > 3 ? `<span class="pmore">+${ps.length - 3}</span>` : '') : `<span class="pempty">${inDrawer ? 'Assign' : ''}</span>`}</button>`;
      }
      case 'phone': return `<input type="text" inputmode="tel" ${base} value="${esc(v)}">`;
      case 'email': return `<input type="text" inputmode="email" ${base} value="${esc(v)}">`;
      default: return `<input type="text" ${base} value="${esc(v)}">`;
    }
  }

  function summaryCell(col, items) {
    if (col.type === 'status') {
      const n = items.length || 1;
      const parts = (col.labels || []).map(l => ({ l, c: items.filter(i => (i.values || {})[col.id] === l.id).length })).filter(x => x.c);
      return `<div class="sumbar" title="${esc(parts.map(p => p.l.label + ': ' + p.c).join(', '))}">${parts.map(p => `<span style="width:${(p.c / n) * 100}%;background:${esc(p.l.color)}"></span>`).join('')}</div>`;
    }
    if (col.type === 'number') {
      const sum = items.reduce((s, i) => s + (Number((i.values || {})[col.id]) || 0), 0);
      if (col.format === 'percent') return '';
      return `<div class="sumnum">${col.format === 'currency' ? '$' + fmtMoney(sum) : sum.toLocaleString('en-CA', { maximumFractionDigits: 2 })}</div>`;
    }
    return '';
  }

  function renderContent() {
    const b = board(), el = $('#content');
    if (S.status === 'offline') { el.innerHTML = `<div class="empty"><h3>Can’t reach the server</h3>Check your connection, then reload the page.</div>`; return; }
    if (S.page === 'dash' && window.KSViews && S.boards.length) { el.innerHTML = KSViews.renderDash(); return; }
    if (S.page === 'home' && S.boards.length) { el.innerHTML = renderHome(); return; }
    if (S.status === 'slow' && !S.boards.length) { el.innerHTML = `<div class="empty"><h3>Still connecting</h3>The boards can’t be reached yet. They will appear here by themselves once the connection comes back.</div>`; return; }
    if (!b) {
      el.innerHTML = renderImporter() + (S.status === 'ready'
        ? `<div class="empty"><h3>No boards yet</h3>Type a name into “+ New board” on the left to make the first one.</div>`
        : `<div class="empty"><h3>Loading your boards</h3>Boards, groups and leads appear here once the workspace connects.</div>`);
      return;
    }
    const people = [...new Set(S.items.flatMap(i => b.columns.filter(c => c.type === 'person').map(c => (i.values || {})[c.id]).filter(Boolean)))];
    const dl = `<datalist id="people">${people.map(p => `<option value="${esc(p)}">`).join('')}</datalist>`;
    const imp = renderImporter();
    if (!S.itemsLoaded && !S.items.length) { el.innerHTML = imp + `<div class="empty"><h3>Loading ${esc(b.name)}</h3>Its items appear here in a moment.</div>`; return; }
    el.innerHTML = imp + dl + (S.view === 'kanban' ? renderKanban(b) : S.view === 'calendar' ? renderCalendar(b) : window.KSViews && KSViews.has(S.view) ? KSViews.render(b) : renderTable(b));
  }

  function renderTable(b) {
    const items = visibleItems();
    const narrow = window.matchMedia('(max-width: 780px)').matches;
    const cols = visCols(b);
    const sortMark = id => S.sort && S.sort.col === id ? `<span class="th-sort">${S.sort.dir === 'desc' ? '↓' : '↑'}</span>` : '';
    const head = cols.map(c => `<th class="w-${c.type}"><button class="col-head" data-act="col-menu" data-col="${esc(c.id)}" title="${isLocked(c, b) ? (colEditable(c, b) ? 'Locked: you can still change it' : 'Locked: only admins can change it') + '. ' : ''}Sort, filter or hide">${isLocked(c, b) ? IC.lock : ''}${esc(c.title)} ${sortMark(c.id)}${(S.filters[c.id] || []).length ? '<span class="th-filter" title="Filtered"></span>' : ''}</button></th>`).join('');
    const addColTh = S.canWrite ? '<th class="add-col"><button data-act="add-column" aria-label="Add column" title="Add column">+</button></th>' : '<th class="add-col"></th>';
    const subCols = b.subColumns || [];
    const span = cols.length + 2;
    const groups = b.groups.map(g => {
      const gi = items.filter(i => i.group === g.id);
      const open = !S.collapsed.has(g.id);
      const limit = S.shown[g.id] || PAGE;
      const allSel = gi.length && gi.every(i => S.selected.has(i.id));
      const rows = gi.slice(0, limit).map(i => {
        const subs = i.subitems || [];
        const exp = S.expanded.has(i.id) && subs.length;
        const sel = S.selected.has(i.id);
        const row = `<tr data-row="${esc(i.id)}" data-group="${esc(g.id)}" class="${sel ? 'sel' : ''}">
          <td class="name-cell"><div class="name-wrap">${S.canWrite ? `<span class="grip" draggable="true" data-rowdrag="${esc(i.id)}" title="Drag to move" aria-hidden="true">⋮⋮</span>` : ''}<input type="checkbox" class="rowcheck" data-sel="${esc(i.id)}" ${sel ? 'checked' : ''} aria-label="Select ${esc(i.name)}">${(subs.length || (b.subColumns || []).length) ? `<button class="sub-toggle" data-act="subs" data-item="${esc(i.id)}" aria-expanded="${!!exp}" title="Subitems">${exp ? '▾' : '▸'} ${subs.length}</button>` : ''}${narrow ? `<button class="name-open" data-act="open" data-item="${esc(i.id)}">${esc(i.name)}${(i.updates || []).length ? `<span class="upd-count">${i.updates.length}</span>` : ''}</button>` : `<input class="cell-input" data-edit="name" data-item="${esc(i.id)}" value="${esc(i.name)}" aria-label="Item name" ${S.canWrite ? '' : 'readonly'} style="padding-left:2px"><button class="open-btn" data-act="open" data-item="${esc(i.id)}">Open${(i.updates || []).length ? ' · ' + i.updates.length : ''}</button>`}</div></td>
          ${cols.map(c => `<td class="c-${c.type} ${c.type === 'number' ? 'num-cell' : ''} ${c.format || ''}">${cellEditor(c, i)}</td>`).join('')}<td></td>
        </tr>`;
        const subRow = exp ? `<tr class="sub-row"><td colspan="${span}">${subTable(b, i)}</td></tr>` : '';
        return row + subRow;
      }).join('');
      const more = gi.length > limit ? `<tr class="more-row"><td class="name-cell" colspan="${Math.min(span, 3)}"><button data-act="more" data-group="${esc(g.id)}">Show ${Math.min(PAGE, gi.length - limit)} more · ${gi.length - limit} hidden</button></td>${cols.slice(1).map(() => '<td></td>').join('')}</tr>` : '';
      const addRow = (S.canWrite ? `<tr class="add-row"><td class="name-cell"><input class="cell-input" data-act-key="add-item" data-group="${esc(g.id)}" placeholder="+ Add item" aria-label="Add item to ${esc(g.name)}" style="padding-left:40px"></td>${cols.map(() => '<td></td>').join('')}<td></td></tr>` : '') + more;
      const sum = `<tr class="sum-row"><td class="name-cell"></td>${cols.map(c => `<td>${summaryCell(c, gi)}</td>`).join('')}<td></td></tr>`;
      return `<section class="group" style="--gc:${esc(g.color)}">
        <div class="group-head" data-dropgroup="${esc(g.id)}">
          <button class="caret" data-act="collapse" data-group="${esc(g.id)}" aria-expanded="${open}" aria-label="Show or hide ${esc(g.name)}"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
          <input class="group-name" data-edit="group-name" data-group="${esc(g.id)}" value="${esc(g.name)}" aria-label="Group name" ${S.canWrite ? '' : 'readonly'}>
          <span class="group-count">${gi.length} ${gi.length === 1 ? 'item' : 'items'}</span>
          ${S.canWrite ? `<button class="icon-btn" data-act="group-color" data-group="${esc(g.id)}">Colour</button>
          <button class="icon-btn" data-act="delete-group" data-group="${esc(g.id)}">${S.confirmDelete === 'g:' + g.id ? ((n => n ? `Delete group and ${n} lead${n === 1 ? '' : 's'}` : 'Click again to delete')(S.items.filter(x => x.group === g.id).length)) : 'Delete'}</button>` : ''}
        </div>
        ${open ? `<div class="tablewrap"><table class="board"><thead><tr><th class="name-cell"><div class="name-wrap" style="padding-left:14px"><input type="checkbox" class="rowcheck" data-selgroup="${esc(g.id)}" ${allSel ? 'checked' : ''} aria-label="Select all in ${esc(g.name)}"><button class="col-head" data-act="col-menu" data-col="name" style="justify-content:flex-start">Item ${sortMark('name')}</button></div></th>${head}${addColTh}</tr></thead><tbody>${rows}${addRow}${sum}</tbody></table></div>` : ''}
      </section>`;
    }).join('');
    const orphans = items.filter(i => !b.groups.some(g => g.id === i.group));
    const orphanNote = orphans.length ? `<p class="rail-note">${orphans.length} item(s) belong to a deleted group. Open one to move it.</p>` : '';
    return groups + orphanNote + (S.canWrite ? `<button class="btn add-group" data-act="add-group">+ Add group</button>` : '');
  }

  function calColId(b) {
    const cols = b.columns.filter(c => c.type === 'date');
    return (cols.find(c => c.id === S.calCol) || cols.find(c => /follow|due|next|callback/i.test(c.title)) || cols[0] || {}).id;
  }
  function renderCalendar(b) {
    const col = b.columns.find(c => c.id === calColId(b));
    if (!col) return `<div class="empty"><h3>Calendar needs a date column</h3>Add a Date column with “+ Column”, then items show up on the day they’re due.</div>`;
    const base = S.calMonth ? new Date(S.calMonth + '-15T12:00:00') : new Date();
    const y = base.getFullYear(), m = base.getMonth();
    const first = new Date(y, m, 1), start = new Date(y, m, 1 - first.getDay()), today = ymd(new Date());
    const sc = b.columns.find(c => c.type === 'status');
    const byDay = {};
    visibleItems().forEach(i => { const v = (i.values || {})[col.id]; if (v) (byDay[v] = byDay[v] || []).push(i); });
    const days = Array.from({ length: 42 }, (_, k) => new Date(y, m, 1 - first.getDay() + k));
    const dow = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="cal-dow">${d}</div>`).join('');
    const cells = days.map(d => {
      const key = ymd(d), list = byDay[key] || [];
      return `<div class="cal-day ${d.getMonth() !== m ? 'out' : ''} ${key === today ? 'today' : ''}"><span class="cal-num">${d.getDate()}</span><div class="cal-list">${list.map(i => { const l = sc && labelOf(sc, (i.values || {})[sc.id]); return `<button class="cal-chip ${l ? '' : 'plain'}" style="${l ? '--c:' + esc(l.color) : ''}" data-act="open" data-item="${esc(i.id)}" title="${esc(i.name)}${l ? ' · ' + esc(l.label) : ''}">${esc(i.name)}</button>`; }).join('')}</div></div>`;
    }).join('');
    const inMonth = Object.entries(byDay).filter(([k]) => k.startsWith(`${y}-${pad(m + 1)}`)).reduce((a, [, v]) => a + v.length, 0);
    return `<div class="cal-head"><h3>${esc(first.toLocaleString('en-CA', { month: 'long', year: 'numeric' }))}</h3>
      <button class="btn" data-act="cal-nav" data-d="-1" aria-label="Previous month">‹</button><button class="btn" data-act="cal-nav" data-d="0">Today</button><button class="btn" data-act="cal-nav" data-d="1" aria-label="Next month">›</button>
      <span class="group-count">${inMonth} items this month by ${esc(col.title)}</span></div>
      <div class="calwrap"><div class="cal">${dow}${cells}</div></div>`;
  }

  function kanbanColId(b) {
    const cols = b.columns.filter(c => c.type === 'status');
    return (cols.find(c => c.id === S.kanbanCol) || cols[0] || {}).id;
  }

  function renderKanban(b) {
    const colId = kanbanColId(b);
    const col = b.columns.find(c => c.id === colId);
    if (!col) return `<div class="empty"><h3>Kanban needs a status column</h3>Add a Status column with “+ Column”, then cards can sit in a lane for each status.</div>`;
    const items = visibleItems();
    const amountCol = b.columns.find(c => c.type === 'number');
    const personCol = b.columns.find(c => c.type === 'person');
    const otherStatus = b.columns.find(c => c.type === 'status' && c.id !== colId);
    const lanes = [...(col.labels || []), { id: '', label: 'No status', color: '#6b7280' }].map(l => {
      const li = items.filter(i => ((i.values || {})[colId] || '') === l.id);
      if (!li.length && (!l.id || l.hidden || (col.labels || []).length > 10)) return '';
      const cards = li.map(i => {
        const g = b.groups.find(x => x.id === i.group);
        const v = i.values || {};
        const ol = otherStatus && labelOf(otherStatus, v[otherStatus.id]);
        return `<div class="card" draggable="${S.canWrite}" data-act="open" data-item="${esc(i.id)}" data-drag="${esc(i.id)}" tabindex="0" role="button">
          <span class="card-name">${esc(i.name)}</span>
          <span class="card-meta">
            ${amountCol && v[amountCol.id] !== '' && v[amountCol.id] != null ? `<span class="amt">${amountCol.format === 'currency' ? '$' : ''}${esc(fmtMoney(v[amountCol.id]))}</span>` : ''}
            ${ol ? `<span class="pill" style="--c:${esc(ol.color)}">${esc(ol.label)}</span>` : ''}
            ${personCol && v[personCol.id] ? `<span>${esc(v[personCol.id])}</span>` : ''}
          </span>
          ${g ? `<span class="group-tag" style="--gc:${esc(g.color)}">${esc(g.name)}</span>` : ''}
        </div>`;
      }).join('');
      return `<div class="lane" data-lane="${esc(l.id)}" data-col="${esc(colId)}" style="--lc:${esc(l.color)}">
        <div class="lane-head"><span>${esc(l.label)}</span><span class="group-count">${li.length}</span></div>
        <div class="lane-body">${cards}</div></div>`;
    }).join('');
    return `<div class="kanban">${lanes}</div>`;
  }

  function renderLayer() {
    let html = '';
    const b = board();
    if (S.openItem && b) {
      const i = itemById(S.openItem);
      if (!i) S.openItem = null;
      else {
        const fields = b.columns.map(c => `<div class="f-label">${isLocked(c, b) ? IC.lock : ''}${esc(c.title)}</div><div class="f-value ${c.format === 'currency' ? 'currency' : ''}" ${c.format === 'currency' ? 'style="position:relative"' : ''}>${c.format === 'currency' ? '<span style="position:absolute;left:10px;color:var(--muted);font-family:var(--f-data)">$</span>' : ''}${cellEditor(c, i, true)}</div>`).join('');

        const updates = (i.updates || []).slice().reverse().map(u => `<div class="update"><div class="u-meta"><b data-uid="${esc(u.by)}">${esc(u.byName || 'Someone')}</b><span>${esc(fmtTime(u.at))}</span></div>${u.text ? `<div class="u-text">${esc(u.text)}</div>` : ''}${(u.files || []).length ? `<div class="file-cell" style="flex-wrap:wrap;padding:0;min-height:0">${u.files.map(f => f.url ? `<span class="file-chip" style="padding-right:10px"><a href="${esc(f.url)}" target="_blank" rel="noopener" title="${esc(f.name)}" ${String(f.url).startsWith('/api/files/') ? 'download' : ''}>📎 ${esc(f.name)}</a></span>` : `<span class="file-chip" style="padding-right:10px">📎 ${esc(f.name)}</span>`).join('')}</div>` : ''}${(u.replies || []).map(rp => `<div class="update" style="margin:6px 0 0 18px"><div class="u-meta"><b>${esc(rp.byName || 'Someone')}</b><span>${esc(fmtTime(rp.at))}</span></div><div class="u-text">${esc(rp.text)}</div></div>`).join('')}</div>`).join('');
        const sys = a => a.by === 'automation' || a.by === 'import' || a.by === 'seed';
        const log = (i.activity || []).map(a => `<li><time>${esc(fmtTime(a.at))}</time><span class="${sys(a) ? 'auto' : ''}">${sys(a) ? '' : `<span data-uid="${esc(a.by)}">Someone</span>: `}${esc(a.text)}</span></li>`).join('');
        const sc = b.subColumns || [];
        const subs = (i.subitems || []).map(s => `<div class="subcard"><b>${esc(s.name)}</b><span class="card-meta">${sc.map(c => { const v = (s.values || {})[c.id]; if (v == null || v === '') return ''; const l = c.type === 'status' && labelOf(c, v); return l ? `<span class="pill" style="--c:${esc(l.color)}">${esc(l.label)}</span>` : `<span>${esc(c.title)}: ${esc(describe(c, v))}</span>`; }).join('')}</span></div>`).join('');
        html += `<div class="scrim" data-act="close-item"></div>
        <aside class="drawer" role="dialog" aria-label="${esc(i.name)}">

  function renderPop(b) {
    const p = S.pop;

    if (p.type === 'status') {
      const col = (p.sub ? (b.subColumns || []) : b.columns).find(c => c.id === p.col);

    }
    if (p.type === 'dropdown') {
      const col = b.columns.find(c => c.id === p.col), item = itemById(p.item); if (!col || !item) return '';

      const opts = [...new Set([...(col.options || []), ...cur])];
      return `<div class="pop" style="${style};width:250px" data-pop><div class="pop-section">${esc(col.title)}</div>

    }
    if (p.type === 'colmenu') {
      const c = p.col === 'name' ? { id: 'name', title: 'Item', type: 'text' } : b.columns.find(x => x.id === p.col);
      if (!c) return '';
      const fl = S.filters[c.id] || [];
      const counts = {}; S.items.forEach(i => { const v = String((i.values || {})[c.id] ?? ''); counts[v] = (counts[v] || 0) + 1; });
      const filt = c.type === 'status' ? `<div class="pop-section">Show only</div>${[...(c.labels || []), { id: '', label: '(blank)', color: 'var(--line)' }].filter(l => counts[l.id] || fl.includes(l.id)).map(l => `<label class="pop-check"><input type="checkbox" data-fcol="${esc(c.id)}" data-fval="${esc(l.id)}" ${fl.includes(l.id) ? 'checked' : ''}><span class="sw" style="background:${esc(l.color)}"></span>${esc(l.label)}<span class="ct">${counts[l.id] || 0}</span></label>`).join('')}` : '';

        <button class="pop-btn" data-act="sort" data-col="${esc(c.id)}" data-dir="desc">Sort descending ↓</button>

    }
    return '';

  function renderModal(b) {

            : `<select class="field-input" id="r-target" aria-label="Group">${b.groups.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select>`}

      return `<h3>Automations on ${esc(b.name)}</h3>

            <select class="field-input" data-guest-add="${esc(u.id)}" aria-label="Share a board with ${esc(u.name)}"><option value="">+ Share a board…</option>${boardOpts(guestBoards(u).map(x => x.id))}</select></div>` : ''}</div>
          <select class="field-input" data-role-for="${esc(u.id)}" aria-label="Role for ${esc(u.name)}" ${u.id === S.uid ? 'disabled' : ''}>${['admin', 'member', 'viewer', 'guest'].map(r => `<option value="${r}" ${u.role === r ? 'selected' : ''}>${r[0].toUpperCase() + r.slice(1)}</option>`).join('')}</select>
          <input class="field-input" id="pw-${esc(u.id)}" type="password" placeholder="New password" aria-label="New password for ${esc(u.name)}" style="width:150px" autocomplete="new-password">

          ${u.role === 'guest' ? '' : `<select class="field-input" data-home-for="${esc(u.id)}" aria-label="Board ${esc(u.name)} opens to"><option value="">Opens to: Home</option>${S.boards.map(x => `<option value="${esc(x.id)}" ${x.id === u.home_board ? 'selected' : ''}>Opens to: ${esc(x.name)}</option>`).join('')}</select>`}
          ${u.id === S.uid ? '' : `<button class="icon-btn" data-act="toggle-person" data-id="${esc(u.id)}" data-off="${u.disabled ? 1 : 0}">${u.disabled ? 'Turn on' : 'Turn off'}</button>`}</div>`).join('');
      const sec = m.security;
      const secHtml = !sec ? '<p>Loading.</p>' : `
        <div class="rule"><div class="rule-text"><b>Require two-factor for everyone</b><div class="card-meta">People without it must set it up right after they sign in, before anything else works.</div></div><button class="toggle" data-act="sec-set" data-k="require2fa" aria-pressed="${!!sec.require2fa}">${sec.require2fa ? 'On' : 'Off'}</button></div>
        <div class="rule"><div class="rule-text"><b>Google sign-in counts as two-factor</b><div class="card-meta">${sec.google ? `Google sign-in is on${(sec.googleDomains || []).length ? ' for ' + esc(sec.googleDomains.join(', ')) : ''}. When this is on, signing in with Google skips the code.` : 'Google sign-in isn’t set up on this server (GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET).'}</div></div><button class="toggle" data-act="sec-set" data-k="googleCounts2fa" aria-pressed="${!!sec.googleCounts2fa}">${sec.googleCounts2fa ? 'On' : 'Off'}</button></div>
        <div class="form-row"><button class="btn" data-act="security">Your two-factor</button></div>`;
      return `<h3>Team and settings</h3>

        ${m.list ? rows : '<p>Loading the team.</p>'}

        ${secHtml}

        <div class="form-row"><input class="field-input" id="np-name" placeholder="Full name" aria-label="Full name" style="flex:1 1 160px"><input class="field-input" id="np-email" type="email" placeholder="Email" aria-label="Email" style="flex:1 1 200px"></div>
        <div class="form-row"><select class="field-input" id="np-role" aria-label="Role">${[['member', 'Member'], ['viewer', 'Viewer'], ['admin', 'Admin'], ['guest', 'Guest (lender, lawyer…)']].map(([v, l]) => `<option value="${v}" ${m.newRole === v ? 'selected' : ''}>${l}</option>`).join('')}</select><input class="field-input" id="np-pw" type="password" placeholder="Starting password (8+ characters)" aria-label="Starting password" style="flex:1 1 200px" autocomplete="new-password"><button class="btn primary" data-act="add-person">Add person</button></div>
        ${m.newRole === 'guest' ? `<div class="form-row np-boards"><span class="rail-note">Boards this guest can see:</span>${S.boards.map(x => `<label class="pop-check" style="padding:2px 6px"><input type="checkbox" class="np-board" value="${esc(x.id)}">${esc(x.name)}</label>`).join('')}</div>` : ''}

  // Admins: column locks, "only items assigned to them", guest-editable columns (shown in the Access window).
  function renderPermsEditor(b) {
    const pm = permsOf(b), locks = pm.locks || {}, assigned = pm.assignedOnly || [], ge = pm.guestEdit || [];
    const cols = b.columns.filter(c => !['formula', 'button', 'item_id', 'created'].includes(c.type));
    const person = b.columns.filter(c => c.type === 'person');
    const rows = cols.map(c => { const lk = Object.prototype.hasOwnProperty.call(locks, c.id);
      return `<div class="rule perm-row"><div class="rule-text"><b>${lk ? IC.lock : ''}${esc(c.title)}</b>${lk ? `<input class="field-input" data-lock-emails="${esc(c.id)}" value="${esc((locks[c.id] || []).join(', '))}" placeholder="Also editable by (emails, comma-separated)" aria-label="People who can still edit ${esc(c.title)}" style="width:100%;margin-top:6px">` : ''}</div>
        <button class="toggle" data-act="perm-lock" data-col="${esc(c.id)}" aria-pressed="${lk}" title="Only admins${lk ? ' and the people listed' : ''} can change a locked column">${lk ? 'Locked' : 'Lock'}</button>
        <button class="toggle" data-act="perm-guest" data-col="${esc(c.id)}" aria-pressed="${ge.includes(c.id)}" title="Guests can change this column">Guests edit</button></div>`; }).join('');
    return `<h3 style="font-size:16px">Members see only items assigned to them</h3>
      <p>Pick person columns. Members, viewers and guests then only see the items with their name in one of them (their Solver.ca name, or a first name nobody else on the team has). Admins always see everything.</p>
      <div class="form-row">${person.map(c => `<button class="toggle" data-act="perm-assigned" data-col="${esc(c.id)}" aria-pressed="${assigned.includes(c.id)}">${esc(c.title)}</button>`).join('') || '<span class="rail-note">This board has no person columns.</span>'}</div>
      <h3 style="font-size:16px">Column permissions</h3>
      <p>A locked column can only be changed by admins and the people you list; everyone else sees it read-only, in the app, through the API and in imports. Guests can change only the columns marked “Guests edit”.</p>
      <div class="perm-list">${rows}</div>`;
  }
  function savePerms(next) { const b = board(); if (!b) return; const perms = { locks: {}, assignedOnly: [], guestEdit: [], ...permsOf(b), ...next }; patchBoard({ perms }); localBoard({ perms }); }

  async function fillNames() {
    if (!S.user) return;
    const els = [...document.querySelectorAll('[data-uid]')];
    const ids = [...new Set(els.map(e => e.dataset.uid).filter(id => id && id.startsWith('u_')))];
    els.forEach(e => { if (e.dataset.uid === 'seed') e.textContent = 'Sample data'; });
    if (!ids.length) return;
    try {
      const ps = await S.user.profiles(ids);
      els.forEach(e => { const p = ps && ps[e.dataset.uid]; if (p) e.textContent = (p.name || 'Someone') + (e.dataset.uid === S.uid ? ' (you)' : ''); });
    } catch (e) {}
  }

  // ---------- events ----------
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    const OPENERS = ['status', 'person', 'col-menu', 'hidden-cols', 'bulk-status', 'group-color', 'dropdown', 'sub-status', 'export-menu'];
    if (S.pop && !e.target.closest('[data-pop]') && !(t && OPENERS.includes(t.dataset.act))) { S.pop = null; if (!t) { renderLayer(); return; } }
    if (!t) return;
    const a = t.dataset.act, b = board();
    if (a === 'close-modal' && e.target !== t) return; // clicks inside the modal box
    if (window.SolverExt && SolverExt.onAct(a, t, e, b)) return; // add-ons: automation editor, docs, AI, alerts
    if (!['delete-item', 'delete-group', 'delete-column', 'bulk-del', 'delete-view', 'reset-2fa'].includes(a)) S.confirmDelete = null;
    switch (a) {
      case 'board': S.page = 'board'; savePage(); S.modal = null; selectBoard(t.dataset.id); render(); break;
      case 'go-home': S.page = 'home'; savePage(); S.modal = null; loadSummary(true); render(); break;
      case 'go-calendar': { if (!board()) return; S.page = 'board'; S.view = 'calendar'; savePage(); S.modal = null; render(); break; }
      case 'sheet-boards': S.modal = { type: 'boards' }; renderLayer(); break;
      case 'sheet-profile': S.modal = { type: 'profile' }; renderLayer(); break;
      case 'quick-new': { const b2 = board(); if (b2 && b2.groups[0]) { S.page = 'board'; savePage(); render(); addItem(b2.groups[0].id, 'New lead', true); } else toast('Open a board first.'); break; }
      case 'saved-view': { const sv = b && (b.views || []).find(v => v.id === t.dataset.id); S.viewId = t.dataset.id; S.view = sv && sv.type && (['kanban', 'calendar'].includes(sv.type) || (window.KSViews && KSViews.has(sv.type))) ? sv.type : 'table'; } S.shown = {}; render(); break;
      case 'save-view': S.modal = { type: 'save-view' }; renderLayer(); setTimeout(() => $('#sv-name') && $('#sv-name').focus(), 0); break;
