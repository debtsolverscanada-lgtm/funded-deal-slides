  // ---------- one-time import of the Monday export (owner only) ----------
  function renderImporter() {
    const m = S.importManifest; if (!m || !S.isOwner) return '';
    const st = S.importState || {}, run = S.importing;
    if (st.finishedAt && !run) return '';
    const pct = run ? Math.round((run.done / Math.max(1, m.total_items)) * 100) : 0;
    return `<div class="importer" id="importer">
      <h3>Copy your Monday workspace in</h3>
      <p>${m.boards.length} boards and ${m.total_items.toLocaleString('en-CA')} items, exported from Monday on ${esc(fmtTime(m.exported_at))}, with their groups, columns, status labels, subitems and recent updates. Only you see this button. Keep this tab open until it finishes. If it stops, press the button again and it picks up where it left off.</p>
      ${run ? `<div class="progress"><span style="width:${pct}%"></span></div><p id="import-msg">${esc(run.msg || '')} ${run.done.toLocaleString('en-CA')} of ${m.total_items.toLocaleString('en-CA')} items (${pct}%)</p>`
            : `<div><button class="btn primary" data-act="run-import">${st.doneChunks && st.doneChunks.length ? 'Resume import' : 'Import from Monday'}</button></div>`}
    </div>`;
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function retry(fn) {
    for (let t = 0; t < 8; t++) {
      try { return await fn(); }
      catch (e) {
        const c = e && e.code;
        if (c === 'quota_exceeded' || c === 'invalid_argument' || c === 'revoked' || c === 'not_granted') throw e;
        await sleep(Math.min(30000, 800 * 2 ** t) + Math.random() * 500);
      }
    }
    throw { code: 'unavailable', message: 'gave up' };
  }
  function tickImport() {
    const el = $('#importer'); if (!el || !S.importing) return;
    const m = S.importManifest, pct = Math.round((S.importing.done / Math.max(1, m.total_items)) * 100);
    const bar = el.querySelector('.progress span'); if (bar) bar.style.width = pct + '%';
    const msg = $('#import-msg'); if (msg) msg.textContent = `${S.importing.msg || ''} ${S.importing.done.toLocaleString('en-CA')} of ${m.total_items.toLocaleString('en-CA')} items (${pct}%)`;
  }
  async function runImport() {
    if (S.importing && !S.importing.finished) return;
    const m = S.importManifest; if (!m) return;
    const done = new Set((S.importState || {}).doneChunks || []);
    S.importing = { done: 0, msg: 'Starting.' }; render();
    try {
      for (const part of m.parts) {
        S.importing.msg = 'Downloading the export.'; tickImport();
        const res = await fetch('import/' + part); if (!res.ok) throw { code: 'missing', message: 'The export file is no longer on this page.' };
        const chunks = await res.json();
        for (let ci = 0; ci < chunks.length; ci++) {
          const key = part + ':' + ci, { board: bd, items } = chunks[ci];
          if (done.has(key)) { S.importing.done += items.length; tickImport(); continue; }
          S.importing.msg = `Copying ${bd.name}.`; tickImport();
          const { id: bid, ...bdata } = bd;
          await retry(() => S.db.doc('boards/' + bid).set(bdata));
          let idx = 0;
          await Promise.all(Array.from({ length: 6 }, async () => {
            while (idx < items.length) {
              const { id: iid, ...doc } = items[idx++];
              await retry(() => S.db.doc('boards/' + bid + '/items/' + iid).set(doc));
              S.importing.done++; if (S.importing.done % 10 === 0) tickImport();
            }
          }));
          done.add(key);
          S.importState = { doneChunks: [...done], exportedAt: m.exported_at };
          await retry(() => S.db.doc('meta/import').set(S.importState));
        }
      }
      S.importState = { doneChunks: [...done], exportedAt: m.exported_at, finishedAt: now() };
      await retry(() => S.db.doc('meta/import').set(S.importState));
      S.importing.finished = true; S.importing = null;
      toast('Import finished. All Monday boards are in.'); render();
    } catch (e) {
      S.importing = null;
      toast(e && e.code === 'quota_exceeded' ? 'The workspace storage is full. Tell Claude so it can trim the import.' : (e && e.message) || 'The import stopped. Press Resume to continue.');
      render();
    }
  }
  async function checkImport() {
    try { S.isOwner = !!(S.user && await S.user.isOwner()); } catch (e) {}
    try { if (S.user) S.me = await S.user.me(); } catch (e) {}
    if (S.me) { S.role = S.me.role; S.isGuest = S.role === 'guest'; }
    tryLand();
    render();
    if (!S.isOwner) return;
    try { const d = await S.db.doc('meta/import').get(); S.importState = d.exists ? d.data() : {}; } catch (e) { S.importState = {}; }
    render();
  }

  function renderSync(st) {
    if (!st) return '<p>Checking the Monday connection.</p>';
    if (!st.configured) return '<p>Not set up yet. Add a Monday API token as MONDAY_API_TOKEN in the server settings (on Render: Environment), then reload this page.</p>';
    const last = st.finishedAt ? (st.error ? `Last copy failed: ${esc(st.error)}` : `Last copied ${esc(fmtTime(st.finishedAt))}: ${st.boards} boards, ${Number(st.items).toLocaleString('en-CA')} items.`) : 'Not copied yet.';
    if (st.running) return `<p><b>Copying now.</b> ${esc(st.msg)}. ${st.boards} boards and ${Number(st.items).toLocaleString('en-CA')} items so far. You can close this window. It keeps going on the server.</p>`;
    const pl = st.pull || {}, hhmm = iso => new Date(iso).toLocaleTimeString('en-CA', { hour: 'numeric', minute: '2-digit' });
    const live = !pl.enabled ? '<span class="pill">Live pull is off</span>'
      : `<span class="pill" title="Every 5 minutes, items changed in Monday are copied here">Live from Monday · ${pl.lastPullAt ? 'last pulled ' + esc(hhmm(pl.lastPullAt)) : 'not pulled yet'}</span>${pl.running ? ' <span class="rail-note">Pulling now…</span>' : ''}`;
    return `<p>Reads ${st.workspaces.length} Monday workspace${st.workspaces.length === 1 ? '' : 's'} and refreshes their boards here. Monday itself is never changed. Monday’s columns, labels, groups, comments and subitems are refreshed to Monday’s current version. Everything added in Solver.ca stays: items, columns and their values, comments, subitems, files, time, docs, permissions, access and views. Every 5 minutes, items changed in Monday since the last pull are copied in on their own.</p>
      <p>${last}${pl.needsFullCopy ? ` <b>${esc(pl.error || 'Run a full copy from Monday to catch up.')}</b>` : pl.error ? ` Last live pull failed: ${esc(pl.error)}` : pl.lastRunAt && pl.enabled ? ` Last live pull: ${Number(pl.saved || 0)} items updated, ${Number(pl.removed || 0)} removed.` : ''}</p>
      <div class="form-row"><button class="btn primary" data-act="monday-sync">Copy from Monday now</button>${live}${pl.enabled ? '<button class="btn" data-act="monday-pull">Pull changes now</button>' : ''}</div>`;
  }
  let syncTimer = null;
  async function loadSync() {
    try { const st = await KS.mondayStatus(); if (S.modal && S.modal.type === 'team') { S.modal.sync = st; renderLayer(); } clearTimeout(syncTimer); if (st.running && S.modal && S.modal.type === 'team') syncTimer = setTimeout(loadSync, 3000); }
    catch (e) {}
  }

  async function loadIntegrations() {
    try { const [keys, hooks] = await Promise.all([KS.api('GET', '/api/admin/keys'), KS.api('GET', '/api/admin/hooks')]); if (S.modal && S.modal.type === 'integrations') { S.modal.data = { keys, hooks }; renderLayer(); } }
    catch (e) { if (S.modal) { S.modal.msg = esc(e.message); renderLayer(); } }
  }
  async function loadTeam() {
    try { const [list, security] = await Promise.all([KS.users(), KS.api('GET', '/api/admin/security').catch(() => null)]); S.team = list; if (S.modal && S.modal.type === 'team') { S.modal.list = list; S.modal.security = security; renderLayer(); } }
    catch (e) { if (S.modal) { S.modal.msg = e.message; renderLayer(); } }
  }
  async function loadTwoFactor() {
    try { const st = await KS.api('GET', '/api/2fa/status'); if (S.modal && S.modal.type === 'security') { S.modal.status = st; renderLayer(); } }
    catch (e) { if (S.modal) { S.modal.msg = e.message; renderLayer(); } }
  }
  // A guest sees exactly the boards that list their email (Team & settings → Share a board).
  function setGuestBoards(u, ids) {
    KS.updateUser(u.id, { boards: ids }).then(() => { S.modal.msg = `${u.name} now sees ${ids.length} board${ids.length === 1 ? '' : 's'}.`; loadTeam(); }).catch(e => { S.modal.msg = e.message; renderLayer(); });
  }
  async function addPerson() {
    const body = { name: $('#np-name').value, email: $('#np-email').value, role: $('#np-role').value, password: $('#np-pw').value };
    if (body.role === 'guest') body.boards = [...document.querySelectorAll('.np-board:checked')].map(x => x.value);
    try { await KS.addUser(body); S.modal.msg = `Added ${body.name.trim()}${body.role === 'guest' ? ` as a guest on ${body.boards.length} board${body.boards.length === 1 ? '' : 's'}` : ''}. Send them the site link, their email and the starting password.`; S.modal.newRole = ''; loadTeam(); }
    catch (e) { S.modal.msg = e.message; renderLayer(); }
  }

  function renderFactFind(b, i) {
    const qs = b.form.questions.map(q => ({ ...q, col: b.columns.find(c => c.id === q.col) })).filter(q => q.col);
    const has = c => { const v = (i.values || {})[c.id]; return v !== undefined && v !== null && v !== ''; };
    const done = qs.filter(q => has(q.col)).length;
    return `<div class="ff-head"><div><h4>${esc(b.form.title || 'Fact find')}</h4><span class="group-count">${done} of ${qs.length} answered</span></div></div>
      <div class="ff-bar"><span style="width:${qs.length ? (done / qs.length) * 100 : 0}%"></span></div>
      <div class="ff">${qs.map((q, k) => `<div class="ff-q"><label><span class="n">${k + 1}</span>${esc(q.q || q.col.title)}</label>${q.desc ? `<span class="hint">${esc(q.desc)}</span>` : ''}
        <div class="ff-box ${has(q.col) ? 'done' : ''} ${q.col.format === 'currency' ? 'currency' : ''} ${q.col.format === 'percent' ? 'percent' : ''}" ${q.col.format === 'currency' ? 'style="padding-left:12px"' : ''}>${cellEditor(q.col, i, true)}</div></div>`).join('')}</div>`;
  }
  // After sign-in, setters land on their own board (set under Team & settings, or matched by name, e.g. "Setter Desk (Jan)").
  function tryLand() {
    if (S.landed || !S.boards.length || !S.me) return false;
    S.landed = true;
    let seen = false; try { seen = !!sessionStorage.getItem('ks-landed'); sessionStorage.setItem('ks-landed', '1'); } catch (x) {}
    if (seen) return false;
    const first = String(S.me.name || '').split(/\s+/)[0].toLowerCase();
    const own = S.boards.find(b => b.id === S.me.homeBoard) || (first && first !== 'your' && S.boards.find(b => /setter desk/i.test(b.name) && b.name.toLowerCase().includes('(' + first)));
    if (!own) return false;
    S.page = 'board'; S.view = 'table'; savePage(); S.boardId = null; selectBoard(own.id); render();
    return true;
  }
  function runButton(itemId, colId) {
    const b = board(), item = itemById(itemId), col = b && b.columns.find(c => c.id === colId); if (!item || !col) return;
    const rules = (b.automations || []).filter(r => r.on !== false && r.trigger === 'button' && r.col === colId);
    if (rules.length) runRules(b, item, rules, `Pressed ${col.title}`);
    KS.api('POST', '/api/press', { board: b.id, item: item.id, col: col.id }).then(r => {
      if (r.sent) toast(`“${col.title}” sent to ${r.sent === 1 ? 'the connected tool' : r.sent + ' connected tools'}.`);
      else if (!rules.length) toast(`“${col.title}” isn’t connected yet. An admin can connect it in Integrations with a “Button pressed” webhook.`);
    }).catch(e => toast(e.message));
  }
  // ---------- subitems (editable, with their own automations) ----------
  function subCell(b, item, sub, c) {
    const v = (sub.values || {})[c.id] ?? '', ro = !S.canWrite || c.readonly || ['formula', 'button', 'item_id', 'created'].includes(c.type);
    const attrs = `data-item="${esc(item.id)}" data-sub="${esc(sub.id)}" data-col="${esc(c.id)}"`;
    if (c.type === 'status') { const l = labelOf(c, v); return `<button class="chip ${l ? '' : 'none'}" style="${l ? '--c:' + esc(l.color) : ''}" data-act="sub-status" ${attrs} ${ro ? 'disabled' : ''}>${l ? esc(l.label) : ''}</button>`; }
    if (ro) return `<span class="ro">${esc(c.type === 'formula' ? '' : describe(c, v) === 'empty' ? '' : describe(c, v))}</span>`;
    if (c.type === 'date') return `<input type="date" class="cell-input" data-sub-edit ${attrs} value="${esc(v)}">`;
    if (c.type === 'checkbox') return `<label class="cb"><input type="checkbox" data-sub-check ${attrs} ${v ? 'checked' : ''}></label>`;
    return `<input class="cell-input" data-sub-edit ${attrs} value="${esc(v)}" ${c.type === 'number' ? 'inputmode="decimal"' : ''}>`;
  }
  function subTable(b, item) {
    const sc = (b.subColumns || []).filter(c => c.type !== 'formula' || true);
    const rows = (item.subitems || []).map(sb => `<tr><td><div class="name-wrap"><input class="cell-input" data-sub-edit data-item="${esc(item.id)}" data-sub="${esc(sb.id)}" data-col="name" value="${esc(sb.name)}" ${S.canWrite ? '' : 'readonly'} aria-label="Subitem name">${S.canWrite ? `<button class="icon-btn" data-act="sub-del" data-item="${esc(item.id)}" data-sub="${esc(sb.id)}" aria-label="Delete subitem">×</button>` : ''}</div></td>${sc.map(c => `<td class="c-${c.type}">${subCell(b, item, sb, c)}</td>`).join('')}</tr>`).join('');
    const add = S.canWrite ? `<tr><td colspan="${sc.length + 1}"><input class="cell-input" data-act-key="add-sub" data-item="${esc(item.id)}" placeholder="+ Add subitem" aria-label="Add subitem"></td></tr>` : '';
    return `<div class="tablewrap" style="border-radius:14px"><table class="board subtable-edit"><thead><tr><th class="name-cell" style="min-width:220px">Subitem</th>${sc.map(c => `<th class="w-${c.type}">${esc(c.title)}</th>`).join('')}</tr></thead><tbody>${rows}${add}</tbody></table></div>`;
  }
  function setSub(itemId, subId, colId, value) {
    const b = board(), item = itemById(itemId); if (!b || !item) return;
    if (!S.canWrite) { toast(S.isGuest ? 'Guests can’t change subitems.' : 'You can view this board but not change it.'); scheduleRender(); return; }
    const subs = JSON.parse(JSON.stringify(item.subitems || [])); const sb = subs.find(x => String(x.id) === String(subId)); if (!sb) return;
    const lines = [], ran = [];
    if (colId === 'name') { if (!value || value === sb.name) return; sb.name = value; }
    else {
      const c = (b.subColumns || []).find(x => x.id === colId); if (!c) return;
      if (!colEditable(c, b)) { toast(`${c.title} is locked. Only admins can change it.`); scheduleRender(); return; }
      if (c.type === 'number' && value !== '') value = Number(String(value).replace(/[^0-9.\-]/g, ''));
      if (String((sb.values || {})[colId] ?? '') === String(value ?? '')) return;
      sb.values = { ...(sb.values || {}), [colId]: value };
      lines.push(`Subitem “${sb.name}”: ${c.title} → ${describe(c, value)}`);
      // subitem rules: same lock policy as item rules (a column the person can't change is skipped and logged)
      rulesOf(b).filter(r => r.trigger === 'sub_status' && r.col === colId && (r.value == null || String(r.value) === String(value))).forEach(r => {
        const texts = [];
        (r.actions || []).forEach(a => { const tc = (b.subColumns || []).find(x => x.id === a.col); if (!tc || !['set_date', 'set_status', 'set_value', 'clear'].includes(a.type)) return;
          if (!colEditable(tc, b)) { texts.push(`skipped: ${tc.title} is locked for ${meName()}`); lines.push(`“${r.title}” skipped: ${tc.title} is locked for ${meName()}`); return; }
          if (a.type === 'set_date') sb.values[tc.id] = ymdPlus(a.offset); else if (a.type === 'clear') sb.values[tc.id] = ''; else sb.values[tc.id] = a.value;
          texts.push(`set ${tc.title} on subitem “${sb.name}”`); lines.push(`“${r.title}” set ${tc.title} on subitem “${sb.name}”`); });
        ran.push({ rule: r, texts });
      });
    }
    item.subitems = subs; let activity = item.activity || []; lines.forEach(t => { activity = [{ at: now(), by: t.startsWith('“') ? 'automation' : S.uid, text: t }, ...activity]; });
    item.activity = activity.slice(0, 40);
    let saved = false; const p = 'boards/' + b.id + '/items/' + item.id;
    write(p, () => S.db.doc(p).update({ subitems: subs, activity: item.activity }).then(r => { saved = true; return r; })).then(() => { if (saved && window.SolverExt) ran.forEach(x => SolverExt.ruleRan(b, item, x.rule, x.texts)); });
    scheduleRender();
  }
  function savePage() { try { localStorage.setItem('ks-page', S.page); localStorage.setItem('ks-view', S.view); } catch (e) {} }
  let summaryBusy = false;
  async function loadSummary(force) {
    if (!window.KS || !S.ws || summaryBusy) return;
    if (!force && S.summary && S.summary.ws === S.ws) return;
    summaryBusy = true;
    try { S.summary = await KS.summary(S.ws); } catch (e) {}
    summaryBusy = false;
    if (S.page === 'home') renderContent();
  }
  function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }
  function sparkSvg(vals) {
    const w = 120, h = 38, max = Math.max(1, ...vals), step = w / (vals.length - 1);
    const pts = vals.map((v, i) => [i * step, h - 4 - (v / max) * (h - 10)]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const last = pts[pts.length - 1];
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#sg)"/><path d="${d}" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="#fff"/></svg>`;
  }
  function ringSvg(frac) {
    const r = 44, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(1, frac)));
    return `<svg class="ring" viewBox="0 0 104 104" aria-hidden="true"><circle cx="52" cy="52" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="7"/><circle cx="52" cy="52" r="${r}" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 52 52)" style="filter:drop-shadow(0 0 6px rgba(255,255,255,.45))"/><text x="52" y="57" text-anchor="middle" fill="#fff" font-size="17" font-weight="500" font-family="-apple-system, system-ui, sans-serif">${Math.round(frac * 100)}%</text></svg>`;
  }
  function renderHome() {
    loadSummary(false);
    const first = String((S.me && S.me.name) || '').split(/\s+/)[0];
    const name = first && !/^your$/i.test(first) ? first : '';
    const wsName = (workspaces().find(w => w.id === S.ws) || {}).name || 'your workspace';
    const sm = S.summary && S.summary.ws === S.ws ? S.summary : null;
    const top = `<div class="home-top"><div><p class="eyebrow">${esc(new Date().toLocaleDateString('en-CA', { weekday: 'long', month: 'long', day: 'numeric' }))}</p><h1>${greeting()}${name ? ', ' + esc(name) : ''}</h1>${S.isGuest ? '<span class="pill guest-badge">Guest</span>' : ''}</div><div style="display:flex;gap:10px">${fx('homeTop') || ''}<button class="icon-round" data-act="sheet-profile" aria-label="Menu">${IC.menu}</button></div></div>`;
    if (!sm) return `<div class="home">${top}<div class="glass hero"><p class="home-skel">Adding up ${esc(wsName)}…</p></div></div>`;
    const f = sm.followups, dueAll = f.overdue + f.dueToday + f.upcoming;
    const onTrack = dueAll ? (f.dueToday + f.upcoming) / dueAll : 1;
    const list = sm.boards.slice(0, 5).map(x => `<button class="li" data-act="board" data-id="${esc(x.id)}"><span class="li-ic">${esc(initials(x.name))}</span><span class="li-main"><b>${esc(x.name)}</b><span>${x.newWeek ? '+' + x.newWeek.toLocaleString('en-CA') + ' this week' : (x.folder ? esc(x.folder) : 'Board')}</span></span><span class="li-val">${x.count.toLocaleString('en-CA')}</span><span class="chev">›</span></button>`).join('');
    return `<div class="home">${top}
      <section class="glass hero" aria-label="Total items">
        <div class="hero-label"><span>Total leads · ${esc(wsName)}</span></div>
        <div class="hero-num">${sm.total.toLocaleString('en-CA')}</div>
        <div class="hero-sub"><span class="delta">${sm.newWeek ? '↑ ' + sm.newWeek.toLocaleString('en-CA') + ' new this week' : 'No new items this week'}</span>${sparkSvg(sm.spark)}</div>
      </section>
      <div class="quick">
        <button class="qa" data-act="quick-new"><span class="qa-ic">${IC.plus}</span>New lead</button>
        <button class="qa" data-act="go-calendar"><span class="qa-ic">${IC.cal}</span>Follow-ups</button>
        <button class="qa" data-act="sheet-boards"><span class="qa-ic">${IC.more}</span>More</button>
      </div>
      <div class="sec"><h2>Boards</h2>${sm.boards.length > 5 ? `<button data-act="sheet-boards">See all ${sm.boards.length}</button>` : ''}</div>
      <div class="glass list">${list || '<p class="home-skel">No boards yet.</p>'}</div>
      <div class="sec"><h2>Follow-ups</h2></div>
      <section class="glass ov">
        <div class="ov-main"><div class="k">Due in the next 7 days</div><div class="v">${(f.dueToday + f.upcoming).toLocaleString('en-CA')}</div>
          <div class="ov-rows"><span><span>Due today</span><b>${f.dueToday.toLocaleString('en-CA')}</b></span><span><span>Overdue</span><b>${f.overdue.toLocaleString('en-CA')}</b></span></div></div>
        ${ringSvg(onTrack)}
      </section>
      <p class="eyebrow" style="text-align:center">Ring shows how many follow-ups are still on time.</p>
    </div>`;
  }
  function renderNav() {
    const nav = $('#bnav'); if (!nav) return;
    const cur = S.page === 'home' ? 'home' : S.page === 'dash' ? 'dash' : S.view === 'calendar' ? 'cal' : 'boards';
    const btn = (k, act, label, ic) => `<button data-act="${act}" aria-current="${cur === k}" aria-label="${label}">${ic}<span>${label}</span></button>`;
    nav.innerHTML = btn('home', 'go-home', 'Home', IC.home) + btn('boards', 'sheet-boards', 'Boards', IC.boards)
      + `<button data-act="quick-new" aria-label="New lead"><span class="bnav-plus">${IC.plus}</span></button>`
      + btn('cal', 'go-calendar', 'Calendar', IC.cal) + btn('me', 'sheet-profile', 'Profile', `<span class="nwrap">${IC.user}${S.notifs.unread ? `<span class="nbadge">${S.notifs.unread > 9 ? '9+' : S.notifs.unread}</span>` : ''}</span>`);
  }

  if (window.KSViews) KSViews.init({ S, board, itemById, visibleItems, labelOf, splitPeople, fileList, isFileCol, describe, colEditable, setValue, patchItem, patchBoard, localBoard, formulaResult, hue, initials, toast, render, renderHead, renderContent, renderLayer, savePage });
  // the page's internals the add-ons use (ext.js, automations.js, editor.js, extras.js)
  Object.assign(window.SolverApp = window.SolverApp || {}, { S, board, itemById, patchBoard, patchItem, localBoard, render, renderLayer, renderContent, scheduleRender, toast, esc, rid, normRule, describe, labelOf, fmtTime, splitPeople, colEditable, isLocked, fillNames, IC });

  async function init() {
    render();
    if (!(window.claude && window.claude.use)) { S.status = 'offline'; render(); return; }
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db) { S.status = 'offline'; render(); return; }
    S.db = db; S.user = user;
    if (user) {
      try { S.uid = (await user.id()) || ''; } catch (e) {}
      try { const c = await user.can('data.write'); if (c === false) S.canWrite = false; } catch (e) {}
    }
    checkImport();
    if (window.KS) KS.users().then(l => { S.team = l; S.teamNames = l.filter(u => !u.disabled).map(u => u.name); }).catch(() => {});
    if (window.KS) {
      loadNotifs();
      window.SolverOpen = (bid, iid) => { if (!S.boards.some(x => x.id === bid)) { toast('That board isn’t available to you.'); return; } S.modal = null; S.page = 'board'; S.view = 'table'; savePage(); selectBoard(bid); if (iid) { if (S.itemsLoaded && itemById(iid)) { S.openItem = iid; S.drawerTab = 'updates'; } else S.pendingOpen = iid; } render(); };
      window.SolverMe = () => ({ id: S.uid, name: (S.me && S.me.name) || '', homeBoard: (S.me && S.me.homeBoard) || '', ws: S.ws, boards: S.boards.map(b => ({ id: b.id, name: b.name })) });
      KS.on('notify', n => { if (S.notifs.items.some(x => x.id === n.id)) return; S.notifs.items.unshift(n); S.notifs.unread++; toast(n.text.length > 110 ? n.text.slice(0, 108) + '…' : n.text); renderRail(); renderNav(); if (S.modal && ['notifs', 'profile'].includes(S.modal.type)) renderLayer(); });
      KS.on('reconnect', loadNotifs);
    }
    const slow = setTimeout(() => { if (S.status === 'loading') { S.status = 'slow'; render(); } }, 10000);
    db.collection('boards').onSnapshot(snap => {
      S.boards = snap.docs.map(d => ({ id: d.id, ...structuredClone(d.data()) })).sort((a, b) => (a.order || 0) - (b.order || 0));
      if (!snap.metadata.fromCache) { S.status = 'ready'; clearTimeout(slow); }
      if (tryLand()) return;
      if (!S.boards.some(b => b.id === S.boardId) || !S.itemsUnsub) {
        const inWs = S.boards.find(b => wsOf(b).id === S.ws);
        const pick = S.boards.some(b => b.id === S.boardId) ? S.boardId : (inWs || S.boards[0] || {}).id;
        if (pick) { S.boardId = null; selectBoard(pick); return; }
      }
      scheduleRender();
    }, () => { clearTimeout(slow); S.status = 'ready'; toast('Boards stopped updating. Reload the page to reconnect.'); render(); });
  }
  // add to (not replace) the shared object: ext.js/automations.js and features.js both read it
  Object.assign(window.SolverApp = window.SolverApp || {}, { S, board, itemById, render, renderLayer, renderContent, renderHead, renderRail, scheduleRender, toast, setValue, patchBoard, localBoard, selectBoard, describe, esc, TYPES, IC, colEditable, fmtTime, labelOf, PALETTE, wsOf, workspaces, savePage, curView });
  init();
})();
</script>
