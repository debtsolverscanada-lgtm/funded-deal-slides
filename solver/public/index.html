<style>
/* Layout: a fixed board rail on the left, the working board on the right; collapses to one column on phones. */
:root {
  /* Glass on black: one deliberate dark look, so no light variant. */
  --bg: #000000;
  --surface: rgba(255, 255, 255, 0.045);
  --surface-2: rgba(255, 255, 255, 0.075);
  --solid: #0c0c0e;
  --line: rgba(255, 255, 255, 0.09);
  --line-2: rgba(255, 255, 255, 0.16);
  --fg: #ffffff;
  --muted: rgba(255, 255, 255, 0.52);
  --accent: #ffffff;
  --accent-fg: #000000;
  --accent-soft: rgba(255, 255, 255, 0.10);
  --warn-bg: rgba(255, 255, 255, 0.04);
  --warn-fg: rgba(255, 255, 255, 0.62);
  --danger: #e3a8a8;
  --shadow: 0 24px 70px rgba(0, 0, 0, 0.65);
  --glow: 0 0 0 1px rgba(255, 255, 255, 0.05), 0 10px 40px rgba(255, 255, 255, 0.035);
  --blur: blur(26px) saturate(150%);
  --r-lg: 22px; --r-md: 14px; --r-sm: 10px;
  --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-data: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px; padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 14px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.brand-mark svg { width: 18px; height: 18px; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: -.01em; }
.brand-tag { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.rail h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.board-list { display: flex; flex-direction: column; gap: 2px; }
.board-link { text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; display: flex; gap: 8px; align-items: center; }
.board-link:hover { background: var(--surface-2); }
.board-link[aria-current="true"] { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.board-link .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--accent); flex: none; }
.rail-input { width: 100%; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 7px; background: transparent; }
.rail-note { margin-top: auto; font-size: 12px; color: var(--muted); line-height: 1.5; }

.main { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.banner { background: var(--warn-bg); color: var(--warn-fg); font-size: 12.5px; padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.head { padding-block: 16px 10px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.head-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.board-title { font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: -.015em; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 0 4px; margin-left: -5px; min-width: 0; flex: 1 1 260px; text-wrap: balance; }
.board-title:hover { border-color: var(--line); }
.board-select { display: none; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); }
.tabs { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.tab { border: 0; background: none; padding: 6px 12px; border-radius: 6px; font-weight: 500; color: var(--muted); }
.tab[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.search { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); width: 200px; max-width: 100%; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--danger); }
.spacer { flex: 1; }
.kbd-select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2); }

.content { flex: 1; overflow: auto; padding-block: 18px 60px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.empty { max-width: 460px; margin: 60px auto; text-align: center; color: var(--muted); line-height: 1.6; }
.empty h3 { font-family: var(--f-display); color: var(--fg); font-size: 20px; margin: 0 0 6px; }

/* Table view */
.group { margin-bottom: 26px; }
.group-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.caret { border: 0; background: none; color: var(--gc); width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; transition: transform .15s; }
.caret[aria-expanded="false"] { transform: rotate(-90deg); }
.group-name { font-family: var(--f-display); font-weight: 600; font-size: 17px; color: var(--gc); border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 1px 4px; min-width: 60px; field-sizing: content; }
.group-name:hover { border-color: var(--line); }
.group-count { font-size: 12px; color: var(--muted); font-family: var(--f-data); }
.icon-btn { border: 0; background: none; color: var(--muted); padding: 4px 6px; border-radius: 5px; font-size: 12px; }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.tablewrap { overflow-x: auto; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); }
table.board { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
.board th, .board td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; height: 38px; text-align: left; vertical-align: middle; }
.board th:last-child, .board td:last-child { border-right: 0; }
.board th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); padding: 0 10px; white-space: nowrap; }
.board th button.col-head { border: 0; background: none; font-weight: 600; color: var(--muted); padding: 6px 0; display: flex; gap: 6px; align-items: center; width: 100%; }
.board th button.col-head:hover { color: var(--fg); }
.col-type { font-family: var(--f-data); font-size: 10px; opacity: .7; }
.board .name-cell { position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 250px; box-shadow: inset 4px 0 0 var(--gc); }
.board thead .name-cell { background: var(--surface-2); }
.name-wrap { display: flex; align-items: center; padding-left: 10px; gap: 4px; }
.cell-input { width: 100%; height: 37px; border: 1px solid transparent; background: transparent; padding: 0 10px; min-width: 0; }
.cell-input:hover { border-color: var(--line); }
.cell-input:focus { background: var(--surface-2); border-color: var(--accent); outline: none; }
.num-cell .cell-input { font-family: var(--f-data); text-align: right; font-variant-numeric: tabular-nums; }
td.currency { position: relative; }
td.currency::before { content: "$"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-family: var(--f-data); pointer-events: none; }
.open-btn { border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 11px; padding: 2px 7px; border-radius: 5px; opacity: 0; }
tr:hover .open-btn, .open-btn:focus-visible { opacity: 1; }
@media (hover: none) { .open-btn { opacity: 1; } }
.chip { width: 100%; height: 37px; border: 0; color: #fff; font-weight: 500; font-size: 13px; padding: 0 10px; text-shadow: 0 1px 0 rgba(0,0,0,.12); }
.chip.none { background: var(--surface-2); color: var(--muted); text-shadow: none; }
.chip:hover { filter: brightness(1.08); }
.w-status { width: 150px; } .w-text { width: 200px; } .w-person { width: 130px; } .w-date { width: 140px; } .w-phone { width: 140px; } .w-email { width: 210px; } .w-number { width: 140px; }
.add-row td { height: 36px; }
.add-row .cell-input { color: var(--muted); }
.sum-row td { height: 30px; background: var(--surface-2); border-bottom: 0; }
.sum-row .name-cell { background: var(--surface-2); }
.sumbar { display: flex; height: 16px; margin: 0 8px; border-radius: 3px; overflow: hidden; background: var(--line); }
.sumbar span { height: 100%; }
.sumnum { font-family: var(--f-data); font-size: 12px; text-align: right; padding: 0 10px; font-variant-numeric: tabular-nums; color: var(--muted); }
.add-group { margin-top: 4px; }

/* Kanban */
.kanban { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding-bottom: 12px; }
.lane { flex: 0 0 260px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; max-height: calc(100vh - 230px); }
.lane-head { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; border-top: 4px solid var(--lc); border-radius: 10px 10px 0 0; font-weight: 600; }
.lane-body { padding: 4px 8px 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 60px; }
.lane.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px; display: flex; flex-direction: column; gap: 6px; cursor: grab; text-align: left; }
.card:hover { border-color: var(--accent); }
.card-name { font-weight: 600; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }
.card-meta .amt { font-family: var(--f-data); color: var(--fg); }
.pill { display: inline-block; padding: 1px 7px; border-radius: 99px; color: #fff; font-size: 11px; }
.group-tag { font-size: 11px; color: var(--gc); font-weight: 600; }

/* Item drawer */
.scrim { position: fixed; inset: 0; background: rgba(5, 15, 12, .35); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); z-index: 21; box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer-head { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
.drawer-title { font-family: var(--f-display); font-size: 22px; font-weight: 700; border: 1px solid transparent; background: transparent; border-radius: 6px; width: 100%; padding: 2px 4px; margin-left: -5px; }
.drawer-title:hover { border-color: var(--line); }
.drawer-body { overflow-y: auto; padding: 16px 20px 30px; display: flex; flex-direction: column; gap: 22px; }
.drawer-body > * { flex-shrink: 0; }
.fields { display: grid; grid-template-columns: 130px minmax(0, 1fr); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.fields > div { border-bottom: 1px solid var(--line); min-height: 38px; display: flex; align-items: center; }
.fields > div:nth-last-child(-n+2) { border-bottom: 0; }
.f-label { padding: 0 12px; font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-right: 1px solid var(--line); }
.f-value { position: relative; }
.f-value .kbd-select { border: 0; background: transparent; width: 100%; height: 37px; border-radius: 0; }
.sec-title { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
.composer { display: flex; flex-direction: column; gap: 8px; }
.composer textarea { width: 100%; min-height: 76px; resize: vertical; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); }
.update { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.update + .update { margin-top: 8px; }
.u-meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; }
.u-meta b { color: var(--fg); font-weight: 600; }
.u-text { white-space: pre-wrap; line-height: 1.5; overflow-wrap: anywhere; }
.log { list-style: none; margin: 0; padding: 0; font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.log li { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; }
.log time { font-family: var(--f-data); font-size: 11px; }
.log .auto { color: var(--accent); }

/* Popover and modal */
.pop { position: fixed; z-index: 40; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 8px; width: 220px; display: flex; flex-direction: column; gap: 4px; max-height: 340px; overflow-y: auto; }
/* Monday-style table details */
.board th { text-align: center; }
.board th button.col-head { justify-content: center; }
.board thead th.name-cell button.col-head, .board thead th.name-cell { text-align: left; }
.board td.c-status, .board td.c-person, .board td.c-date { text-align: center; }
.board td.c-person .cell-input, .board td.c-date .cell-input { text-align: center; }
td.percent { position: relative; }
td.percent::after { content: "%"; position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--muted); font-family: var(--f-data); pointer-events: none; }
td.percent .cell-input { padding-right: 22px; }
.ro { padding: 0 10px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.board tbody tr:hover td { background: var(--surface-2); }
.board tbody tr:hover td.name-cell { background: var(--surface-2); }
.sub-toggle { white-space: nowrap; flex: none; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font-size: 11px; padding: 1px 6px; border-radius: 5px; font-family: var(--f-data); }
.sub-row > td { background: var(--surface-2); padding: 6px 10px 10px 34px !important; height: auto; }
.subtable { border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.subtable th, .subtable td { border: 1px solid var(--line); padding: 5px 10px; font-size: 12.5px; white-space: nowrap; height: 30px; }
.subtable th { background: var(--surface-2); color: var(--muted); font-weight: 600; }
.more-row td { height: 36px; }
.more-row button { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0 12px; height: 36px; }
.folder-name { font-size: 12px; color: var(--muted); padding: 8px 10px 2px; font-weight: 600; }
.whoami { display: flex; flex-direction: column; gap: 2px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-size: 12.5px; }
.whoami b { font-weight: 600; }
.role { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 700; }
.importer { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; display: flex; flex-direction: column; gap: 10px; }
.importer h3 { margin: 0; font-family: var(--f-display); font-size: 17px; }
.importer p { margin: 0; line-height: 1.5; }
.progress { height: 8px; background: var(--surface); border-radius: 99px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.sublist { display: flex; flex-direction: column; gap: 6px; }
.subcard { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.subcard .card-meta { gap: 10px; }
.ws-select { width: 100%; font-weight: 600; }
.people-cell { width: 100%; height: 37px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; gap: 0; padding: 0 8px; }
.people-cell:hover { background: var(--surface-2); }
.f-value .people-cell { justify-content: flex-start; gap: 8px; }
.av { width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: 10.5px; font-weight: 600; display: inline-grid; place-items: center; border: 2px solid var(--surface); margin-left: -6px; flex: none; }
.av:first-child { margin-left: 0; }
.pmore, .pempty, .pnames { font-size: 12px; color: var(--muted); margin-left: 4px; }
.pnames { color: var(--fg); font-size: 13px; }
.grip { cursor: grab; color: var(--muted); font-size: 12px; padding: 0 2px; letter-spacing: -2px; opacity: 0; user-select: none; }
tr:hover .grip { opacity: 1; }
.rowcheck { width: 15px; height: 15px; accent-color: var(--accent); flex: none; margin: 0 4px 0 2px; }
.board tr.sel td, .board tr.sel td.name-cell { background: var(--accent-soft); }
.board tr.drop-target td { box-shadow: inset 0 2px 0 var(--accent); }
.group-head.drop-target { outline: 2px dashed var(--accent); outline-offset: 2px; border-radius: 6px; }
.th-sort { color: var(--accent); font-size: 11px; }
.th-filter { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }
.board th.add-col { width: 44px; padding: 0; }
.board th.add-col button { width: 100%; height: 37px; border: 0; background: none; color: var(--muted); font-size: 18px; }
.board th.add-col button:hover { color: var(--fg); background: var(--surface); }
.pop-section { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; padding: 6px 4px 2px; }
.pop-btn { text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 6px; }
.pop-btn:hover { background: var(--surface-2); }
.pop-check { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; font-size: 13px; cursor: pointer; }
.pop-check:hover { background: var(--surface-2); }
.pop-check input { accent-color: var(--accent); }
.pop-check .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.pop-check .ct { margin-left: auto; color: var(--muted); font-family: var(--f-data); font-size: 11px; }
.bulkbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 25; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 12px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: calc(100% - 32px); }
.bulkbar .count { background: var(--accent); color: var(--accent-fg); border-radius: 7px; padding: 6px 10px; font-weight: 600; }
.drawer-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 20px; }
.drawer-tab { border: 0; background: none; padding: 10px 12px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.drawer-tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.drawer-actions { display: flex; gap: 6px; }
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.cal-head h3 { font-family: var(--f-display); margin: 0 8px 0 0; font-size: 20px; }
.calwrap { overflow-x: auto; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(110px, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--line); gap: 1px; min-width: 770px; }
.cal-dow { background: var(--surface-2); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 6px 8px; font-weight: 600; }
.cal-day { background: var(--surface); min-height: 112px; padding: 6px; display: flex; flex-direction: column; gap: 3px; }
.cal-day.out { background: var(--surface-2); }
.cal-day.today .cal-num { background: var(--accent); color: var(--accent-fg); border-radius: 99px; padding: 0 6px; }
.cal-num { font-family: var(--f-data); font-size: 11px; color: var(--muted); align-self: flex-start; }
.cal-list { display: flex; flex-direction: column; gap: 3px; overflow-y: auto; max-height: 150px; }
.cal-chip { border: 0; color: #fff; text-align: left; font-size: 11.5px; padding: 3px 6px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-chip.plain { background: var(--accent-soft); color: var(--fg); }

body { margin: 0; } [hidden] { display: none !important; }

/* ================= Glass theme ================= */
body { background: radial-gradient(900px 520px at 78% -8%, rgba(255,255,255,0.075), transparent 62%), radial-gradient(700px 500px at -10% 110%, rgba(255,255,255,0.04), transparent 60%), #000; background-attachment: fixed; -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; }

.whoami { background: var(--surface); border-color: var(--line); border-radius: var(--r-md); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
.role { color: var(--muted); }
.banner { background: transparent; color: var(--muted); border-bottom: 1px solid var(--line); font-size: 12px; }
.head { background: transparent; border-bottom: 1px solid var(--line); }
.board-title { font-weight: 600; letter-spacing: -0.025em; }
.tabs { background: var(--surface); border-color: var(--line); border-radius: 999px; padding: 3px; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
.tab { border-radius: 999px; }
.tab[aria-pressed="true"] { background: rgba(255,255,255,0.14); color: #fff; box-shadow: inset 0 0 0 1px var(--line-2), 0 0 18px rgba(255,255,255,0.06); }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; color: #fff; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); transition: background .15s, border-color .15s; }
.btn:hover { background: rgba(255,255,255,0.10); border-color: var(--line-2); }

.search, .kbd-select, .field-input, .rail-input, .pop input, .composer textarea { background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 12px; color: #fff; }

.tablewrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); box-shadow: var(--glow); }

/* status chips: frosted pill with a soft, muted colour dot */
.chip { --c: transparent; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); color: #fff; border-radius: 999px; height: 28px; width: calc(100% - 12px); margin: 0 6px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-weight: 500; font-size: 12.5px; text-shadow: none; white-space: nowrap; overflow: hidden; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); filter: saturate(0.55) brightness(1.15); box-shadow: 0 0 10px var(--c); flex: none; }

/* kanban */

.head:not(.compact) .head-row { gap: 8px; }

.head .hd-title .board-title { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 2px 8px; margin-left: -8px; min-width: 0; width: auto; max-width: 46vw; flex: 0 1 auto; }
.head .hd-title .board-title:hover { border-color: var(--line); }
.head .hd-title .board-title:focus { border-color: var(--line-2); outline: none; }
.head .hd-switch { display: block; flex: none; width: 30px; min-width: 30px; height: 30px; padding: 0; color: transparent; border-radius: 8px; background: transparent url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23a1a1aa" stroke-width="2" stroke-linecap="round"><path d="m7 10 5 5 5-5"/></svg>') center / 18px no-repeat; border: 1px solid transparent; cursor: pointer; appearance: none; -webkit-appearance: none; }
.head .hd-switch:hover { border-color: var(--line); background-color: rgba(255,255,255,0.05); }
.head .hd-switch option, .head .hd-switch optgroup { color: var(--fg); background: #18181b; }
.head .hd-actions { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; justify-content: flex-end; }
.head .hd-actions .btn { background: transparent; border-color: transparent; color: var(--muted); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; }
.head .hd-actions .btn:hover { color: var(--fg); background: rgba(255,255,255,0.06); }
.head .hd-actions .hd-share { border-color: var(--line); color: var(--fg); margin-left: 6px; }
.head .hd-actions .pill { display: inline-flex; align-items: center; gap: 6px; }
.hd-ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.head .hd-tabs { border-bottom: 1px solid var(--line); margin: 0; padding: 0; }
.head .hd-tabs .tabs { background: none; border: 0; border-radius: 0; padding: 0; gap: 2px; backdrop-filter: none; box-shadow: none; flex-wrap: wrap; }
.head .hd-tabs .tab { background: none !important; border: 0; border-radius: 0; color: var(--muted); padding: 8px 12px 9px; min-height: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; box-shadow: none; }
.head .hd-tabs .tab:hover { color: var(--fg); }
.head .hd-tabs .tab[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--fg); }
.head .hd-tools { padding: 10px 0 12px; align-items: center; }
.head .hd-tools .btn.primary { font-weight: 600; }
.head .hd-tools .hd-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.head .hd-tools .hd-ghost:hover { color: var(--fg); background: rgba(255,255,255,0.06); }
.head .hd-search { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; border-radius: 8px; padding: 0 8px; color: var(--muted); transition: border-color .15s; }
.head .hd-search:focus-within, .head .hd-search:hover { border-color: var(--line); }
.head .hd-search svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.head .hd-search .search { border: 0 !important; background: transparent !important; width: 150px; padding: 0; height: 34px; box-shadow: none; }
.head .hd-search .search:focus { width: 220px; outline: none; }
.head .hd-tools .kbd-select { background-color: transparent; border-color: transparent; color: var(--muted); }
.head .hd-tools .kbd-select:hover { border-color: var(--line); color: var(--fg); }
.head .hd-tools .group-count { color: var(--muted); font-size: 12px; }
/* group headers: Colour / Delete only when you point at the group (always there on touch screens) */
@media (hover: hover) { .group-head .icon-btn[data-act="group-color"], .group-head .icon-btn[data-act="delete-group"] { opacity: 0; transition: opacity .15s; }
  .group-head:hover .icon-btn, .group-head:focus-within .icon-btn { opacity: 1; } }

/* ---- sidebar: quiet nav, workspace + boards, and you at the bottom (settings live in your profile sheet) ---- */
#rail { display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 780px) { #rail { display: none; } }
#rail .rl-nav { display: flex; flex-direction: column; gap: 2px; }
#rail .rl-link { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 8px; text-align: left; cursor: pointer; }
#rail .rl-link:hover { color: var(--fg); background: rgba(255,255,255,0.05); }
#rail .rl-link[aria-current="true"] { color: var(--fg); background: rgba(255,255,255,0.08); }
#rail .rl-link .nbadge { margin-left: auto; }
#rail .rl-ic { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#rail .rl-nav .board-link { padding: 7px 10px; font-size: 14px; color: var(--muted); }
#rail .rl-sec h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px 2px; display: flex; align-items: center; gap: 6px; }
#rail .rl-count { font-size: 11px; color: var(--muted); background: rgba(255,255,255,0.06); border-radius: 999px; padding: 0 7px; letter-spacing: 0; }
#rail .ws-select { width: 100%; }
#rail > * { flex-shrink: 0; }
#rail .rl-boards { flex: 1 1 auto; flex-shrink: 1; min-height: 140px; overflow-y: auto; margin-right: -6px; padding-right: 6px; scrollbar-width: thin; }
#rail .rl-boards .board-list { display: flex; flex-direction: column; gap: 1px; }
#rail .rl-boards .board-link { font-size: 14px; padding: 6px 10px; }
#rail .rail-input { width: 100%; margin: 6px 0 0; }
#rail .rl-new { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
#rail .rl-minor { display: flex; gap: 6px; align-items: center; margin: 8px 0 0 4px; color: var(--muted); font-size: 12px; }
#rail .rl-minor button { border: 0; background: none; color: var(--muted); font: inherit; padding: 2px 0; cursor: pointer; }
#rail .rl-minor button:hover { color: var(--fg); text-decoration: underline; }
#rail .rl-me { margin-top: auto; display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,0.03); color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
#rail .rl-me:hover { background: rgba(255,255,255,0.07); }
#rail .rl-av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,0.1); font-size: 12px; font-weight: 700; flex: none; }
#rail .rl-who { display: flex; flex-direction: column; min-width: 0; flex: 1; }
#rail .rl-who b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#rail .rl-who small { font-size: 11px; color: var(--muted); }
#rail .rl-dots { color: var(--muted); font-size: 18px; }

/* ---- email from a lead ---- */
.email-cell { display: flex; align-items: center; min-width: 0; }
.email-cell > .cell-input { flex: 1 1 auto; min-width: 0; }
.mail-btn { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; margin-right: 4px; }
.mail-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.mail-btn:hover { color: var(--fg); background: rgba(255,255,255,0.08); }
@media (hover: hover) { tr .mail-btn { opacity: 0; } tr:hover .mail-btn, .mail-btn:focus-visible { opacity: 1; } }
.em-form { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 12px; }
.em-row { display: flex; align-items: center; gap: 12px; font-size: 14px; }
.em-row > span { width: 44px; color: var(--muted); flex: none; }
.em-row .field-input { flex: 1; }
.em-form textarea { resize: vertical; min-height: 180px; font: inherit; line-height: 1.5; }
.em-warn { color: #ffd27a; margin: 4px 0 8px; }

/* ---- mass email / text ---- */
.bl-preview { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 4px 0 12px; background: rgba(255,255,255,0.03); }
.bl-preview p { margin: 0 0 6px; }
.bl-preview details { margin: 4px 0 8px; color: var(--muted); font-size: 13px; }
.bl-preview ul { margin: 6px 0 0 18px; padding: 0; }
.bl-sample { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 6px; }
.blast-pill { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 40; display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 16px; border-radius: 999px; background: #18181b; border: 1px solid var(--line-2); box-shadow: 0 10px 30px rgba(0,0,0,.5); font-size: 13px; }
@media (max-width: 780px) { .blast-pill { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); max-width: calc(100vw - 24px); } }

/* ---- Team page ---- */
.tm-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tm-head h3 { margin: 0; }
.tm-legend { font-size: 12px; color: var(--muted); margin: 10px 0 12px; }
.tm-legend b { color: var(--fg); font-weight: 600; }
.tm-add { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 10px 0; background: rgba(255,255,255,0.03); }
.tm-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.tm-row { border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,0.02); }
.tm-row.is-off { border-color: rgba(255,120,120,0.35); }
.tm-row.is-open { background: rgba(255,255,255,0.04); }
.tm-main { display: flex; align-items: center; gap: 10px; padding: 10px 12px; flex-wrap: wrap; }
.tm-av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,0.1); font-size: 12px; font-weight: 700; flex: none; }
.tm-who { display: flex; flex-direction: column; min-width: 140px; flex: 1 1 180px; }
.tm-who b { font-size: 15px; }
.tm-who span { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.tm-you { font-size: 11px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; margin-left: 4px; }
.tm-role { width: auto; flex: none; }
.tm-status { flex: none; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; border: 1px solid transparent; font: inherit; font-size: 12px; cursor: pointer; }
.tm-status.on { background: rgba(80,200,120,0.12); color: #7ee2a0; border-color: rgba(80,200,120,0.3); }
.tm-status.off { background: rgba(255,90,90,0.14); color: #ff9a9a; border-color: rgba(255,90,90,0.4); }
span.tm-status { cursor: default; }
.tm-manage { flex: none; }
.tm-warn { margin: 0 12px 10px; font-size: 13px; color: #ff9a9a; }
.tm-more { border-top: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.tm-field { display: flex; flex-direction: column; gap: 6px; }
.tm-field label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.tm-field small { font-size: 12px; color: var(--muted); }
.tm-inline { display: flex; gap: 8px; flex-wrap: wrap; }
.tm-inline .field-input { flex: 1 1 200px; }
.tm-danger { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid rgba(255,90,90,0.35); background: rgba(255,90,90,0.06); border-radius: 10px; padding: 10px 12px; }
.tm-danger small { display: block; color: var(--muted); font-size: 12px; }

/* ---- selection bar, Monday style: count, then icon-over-label actions ---- */
.bulkbar { display: flex; align-items: stretch; gap: 0; padding: 6px 6px 6px 14px; border-radius: 16px; }
.bulkbar .bb-count { display: flex; align-items: center; gap: 10px; padding-right: 14px; margin-right: 6px; border-right: 1px solid var(--line); flex: none; }
.bulkbar .bb-num { min-width: 30px; height: 30px; padding: 0 8px; border-radius: 999px; background: #fff; color: #000; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.bulkbar .bb-label { font-weight: 600; font-size: 14px; white-space: nowrap; }
.bulkbar .bb-actions { display: flex; align-items: stretch; gap: 2px; }
.bulkbar .bb-btn { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 74px; padding: 6px 8px; border: 0; border-radius: 10px; background: transparent; color: var(--fg); font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
.bulkbar .bb-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.bulkbar .bb-btn:hover, .bulkbar .bb-btn:focus-within { background: rgba(255,255,255,0.08); }
.bulkbar .bb-danger { color: #ff9a9a; }
.bulkbar .bb-danger.is-armed { background: rgba(255,90,90,0.16); }
.bulkbar .bb-sel { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
.bulkbar .bb-close { flex: none; align-self: center; width: 34px; height: 34px; margin-left: 6px; border: 0; border-left: 1px solid var(--line); border-radius: 0 10px 10px 0; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.bulkbar .bb-close svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.bulkbar .bb-close:hover { color: var(--fg); }
@media (max-width: 780px) { .bulkbar .bb-label { display: none; } .bulkbar .bb-btn { min-width: 64px; } }

/* clicking a lead's name opens it (rename it at the top of the lead panel) */
.name-open { cursor: pointer; }
.name-open .nm { font-size: 14px; }
@media (hover: hover) { .name-open:hover .nm { text-decoration: underline; text-underline-offset: 3px; } }

/* Home banner: a slow aurora video (made with Grok Imagine) behind the greeting and the motto */
.home-hero { position: relative; overflow: hidden; border-radius: 20px; border: 1px solid var(--line); padding: 26px 22px 24px; min-height: 168px; align-items: flex-start; background: #0b0b0d url('/media/home-banner.jpg') center / cover no-repeat; }
.home-hero .hero-vid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .9; pointer-events: none; }
.home-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.15) 100%); pointer-events: none; }
.home-hero > * { position: relative; z-index: 1; }
.home-hero .hero-in h1 { text-shadow: 0 2px 18px rgba(0,0,0,.5); }
.hero-quote { margin: 8px 0 0; font-size: 13px; font-style: italic; color: rgba(255,255,255,.72); letter-spacing: .01em; }
@media (max-width: 780px) { .home-hero { border-radius: 16px; padding: 20px 16px; min-height: 140px; } }

/* 19¢ coin spinning in the Home banner */
.home-hero .hero-coin { position: absolute; right: clamp(70px, 14%, 220px); top: 50%; width: 92px; height: 92px; margin-top: -46px; perspective: 700px; z-index: 1; pointer-events: none; animation: coinFloat 4.5s ease-in-out infinite; }
.coin3d { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: coinSpin 6s cubic-bezier(.45,.05,.55,.95) infinite; }
.coin-face, .coin-edge { position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; }
.coin-edge { backface-visibility: visible; background: linear-gradient(90deg, #6b5320, #c9a35a 30%, #f4dc9c 50%, #b88d3e 70%, #5d4518); transform: translateZ(var(--z)); }
.coin-face { display: grid; place-items: center; background: radial-gradient(circle at 34% 28%, #fff4cf 0%, #f1d18a 22%, #d6a94f 52%, #a87a2c 78%, #7b5719 100%); box-shadow: inset 0 0 0 3px rgba(255,236,190,.55), inset 0 -6px 14px rgba(90,60,10,.45), inset 0 6px 12px rgba(255,255,255,.35); }
.coin-face.front { transform: translateZ(5px); }
.coin-face.back { transform: rotateY(180deg) translateZ(5px); }
.coin-face .c-ring { position: absolute; inset: 8px; border-radius: 50%; border: 1.5px dashed rgba(110,75,15,.45); }
.coin-face .c-val { font-weight: 800; font-size: 30px; letter-spacing: -.02em; color: #6a4a12; text-shadow: 0 1px 0 rgba(255,240,200,.8), 0 -1px 0 rgba(80,50,5,.35); display: flex; align-items: flex-start; }
.coin-face .c-val small { font-size: 17px; margin: 3px 0 0 1px; }
.coin-face::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.55) 45%, transparent 60%); background-size: 250% 100%; animation: coinGlint 6s ease-in-out infinite; mix-blend-mode: overlay; }
.coin-shadow { position: absolute; left: 18%; right: 18%; bottom: -22px; height: 10px; border-radius: 50%; background: radial-gradient(rgba(0,0,0,.55), transparent 70%); animation: coinShadow 4.5s ease-in-out infinite; }
@keyframes coinSpin { 0% { transform: rotateY(0deg) rotateX(8deg); } 45% { transform: rotateY(180deg) rotateX(8deg); } 55% { transform: rotateY(180deg) rotateX(8deg); } 100% { transform: rotateY(360deg) rotateX(8deg); } }
@keyframes coinFloat { 0%, 100% { transform: translateY(-6px); } 50% { transform: translateY(6px); } }
@keyframes coinShadow { 0%, 100% { transform: scale(.85); opacity: .5; } 50% { transform: scale(1); opacity: .8; } }
@keyframes coinGlint { 0%, 100% { background-position: 120% 0; } 50% { background-position: -20% 0; } }
html.mx-off .hero-coin, html.mx-off .coin3d, html.mx-off .coin-shadow, html.mx-off .coin-face::after { animation: none; }
html.mx-calm .coin3d { animation-duration: 12s; }
@media (prefers-reduced-motion: reduce) { .hero-coin, .coin3d, .coin-shadow, .coin-face::after { animation: none !important; } }
@media (max-width: 780px) { .home-hero .hero-coin { width: 64px; height: 64px; margin-top: -32px; right: 18px; top: auto; bottom: 30px; } .coin-face .c-val { font-size: 21px; } .coin-face .c-val small { font-size: 12px; } }

/* rotating banner quotes */
.hero-quote { max-width: 620px; transition: opacity .38s ease, transform .38s ease, filter .38s ease; min-height: 1.4em; }
.hero-quote.q-out { opacity: 0; transform: translateY(-6px); filter: blur(3px); }
.hero-quote.q-in { animation: qIn .5s ease both; }
@keyframes qIn { from { opacity: 0; transform: translateY(6px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
@media (max-width: 780px) { .hero-quote { max-width: 70%; } }

/* Penny's desk in the sidebar: Penny sits here at her computer on computers (phones keep her as before) */
#rail .penny-desk { position: relative; flex-shrink: 0; height: 120px; margin: 4px 0 -6px; pointer-events: none; }
#rail .penny-desk .pd-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#rail .penny-desk .pd-spot { position: absolute; left: 6px; bottom: 6px; width: 74px; height: 86px; }
.pd-l { width: 0; animation: pdType 9s steps(1) infinite; }
.pd-l.l1 { --w: 30px; animation-name: pdT1; } .pd-l.l2 { --w: 40px; animation-name: pdT2; } .pd-l.l3 { --w: 22px; animation-name: pdT3; } .pd-l.l4 { --w: 34px; animation-name: pdT4; } .pd-l.l5 { --w: 18px; animation-name: pdT5; }
@keyframes pdT1 { 0% { width: 0; } 4% { width: 10px; } 8% { width: 20px; } 12%, 92% { width: 30px; } 100% { width: 0; } }
@keyframes pdT2 { 0%, 14% { width: 0; } 18% { width: 14px; } 22% { width: 28px; } 26%, 92% { width: 40px; } 100% { width: 0; } }
@keyframes pdT3 { 0%, 30% { width: 0; } 34% { width: 12px; } 38%, 92% { width: 22px; } 100% { width: 0; } }
@keyframes pdT4 { 0%, 42% { width: 0; } 46% { width: 12px; } 50% { width: 24px; } 54%, 92% { width: 34px; } 100% { width: 0; } }
@keyframes pdT5 { 0%, 58% { width: 0; } 62% { width: 10px; } 66%, 92% { width: 18px; } 100% { width: 0; } }
.pd-cur { animation: pdBlink .9s steps(1) infinite; }
@keyframes pdBlink { 50% { opacity: 0; } }
.pd-kb { animation: pdKey .25s steps(2) infinite; }
@keyframes pdKey { 50% { fill: #474c5a; } }
.pd-steam { animation: pdSteam 3s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
.pd-steam.s2 { animation-delay: 1.4s; }
@keyframes pdSteam { 0% { opacity: 0; transform: translateY(4px) scaleY(.7); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px) scaleY(1.1); } }
html.mx-off .penny-desk *, html.mx-off .penny-desk { animation: none !important; }
html.mx-off .pd-l { width: var(--w); }
@media (prefers-reduced-motion: reduce) { .penny-desk * { animation: none !important; } .pd-l { width: var(--w); } }
@media (max-height: 680px) { #rail .penny-desk { display: none; } }
/* Penny docked at her desk: she sits on the chair, facing the screen, typing */
html.pet-docked .pet { left: var(--pd-left, 22px) !important; bottom: var(--pd-bottom, 100px) !important; right: auto !important; top: auto !important; }
html.pet-docked .pet svg { animation: pdPennyType 1.6s ease-in-out infinite; }
@keyframes pdPennyType { 0%, 100% { transform: translateY(0) rotate(4deg); } 50% { transform: translateY(-2px) rotate(6deg); } }
html.mx-off.pet-docked .pet svg { animation: none; }

/* wide lead panel on computers: fields as a form on the left, updates on the right (like Monday's item view) */
.drawer.wide { width: min(1440px, calc(100vw - 48px)); border-radius: var(--r-lg) 0 0 var(--r-lg); }
.drawer.wide .dw-split { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(380px, 1fr); }
.drawer.wide .dw-left { overflow-y: auto; padding: 18px 22px 30px; border-right: 1px solid var(--line); }
.drawer.wide .dw-right { display: flex; flex-direction: column; min-height: 0; }
.drawer.wide .dw-right .drawer-body { flex: 1 1 auto; overflow-y: auto; }
.fgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 16px; }
.fgrid .fcell { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

  function loadHidden() { try { S.hidden = new Set(JSON.parse(localStorage.getItem('ks-hidden-' + S.boardId) || '[]')); } catch (e) { S.hidden = new Set(); } }
  function saveHidden() { try { localStorage.setItem('ks-hidden-' + S.boardId, JSON.stringify([...S.hidden])); } catch (e) {} }

  const visCols = b => { const v = curView(); let cols = b.columns; if (v && Array.isArray(v.columns) && v.columns.length) { const order = v.columns.filter(id => id !== 'name'); cols = order.map(id => b.columns.find(c => c.id === id)).filter(Boolean); } return cols.filter(c => !S.hidden.has(c.id)); };

  // Admins: column locks, "only items assigned to them", guest-editable columns (shown in the Access window).
  function renderPermsEditor(b) {

      <h3 style="font-size:16px">Column permissions</h3>

  function savePerms(next) { const b = board(); if (!b) return; const perms = { locks: {}, assignedOnly: [], guestEdit: [], ...permsOf(b), ...next }; patchBoard({ perms }); localBoard({ perms }); }

  async function fillNames() {
    if (!S.user) return;

  document.addEventListener('drop', e => {

    if (!id) return;

      const sec = e.target.closest('#content section.group[data-g]'), b = board(); if (!sec || !b || sec.dataset.g === id) return; e.preventDefault();
      const r = sec.getBoundingClientRect(), after = e.clientY > r.top + Math.min(r.height / 2, 60);
      const moving = b.groups.find(g => g.id === id); if (!moving) return;
      const rest = b.groups.filter(g => g.id !== id), k = rest.findIndex(g => g.id === sec.dataset.g); if (k < 0) return;

  // ---------- one-time import of the Monday export (owner only) ----------

    const pct = run ? Math.round((run.done / Math.max(1, m.total_items)) * 100) : 0;

  }
  async function runImport() {
    if (S.importing && !S.importing.finished) return;
    const m = S.importManifest; if (!m) return;
    const done = new Set((S.importState || {}).doneChunks || []);
    S.importing = { done: 0, msg: 'Starting.' }; render();
    try {
      for (const part of m.parts) {
        S.importing.msg = 'Downloading the export.'; tickImport();

  }

    const rows = (item.subitems || []).map(sb => `<tr><td><div class="name-wrap"><input class="cell-input" data-sub-edit data-item="${esc(item.id)}" data-sub="${esc(sb.id)}" data-col="name" value="${esc(sb.name)}" ${S.canWrite ? '' : 'readonly'} aria-label="Subitem name">${S.canWrite ? `<button class="icon-btn" data-act="sub-del" data-item="${esc(item.id)}" data-sub="${esc(sb.id)}" aria-label="Delete subitem">×</button>` : ''}</div></td>${sc.map(c => `<td class="c-${c.type}">${subCell(b, item, sb, c)}</td>`).join('')}</tr>`).join('');
    const add = S.canWrite ? `<tr><td colspan="${sc.length + 1}"><input class="cell-input" data-act-key="add-sub" data-item="${esc(item.id)}" placeholder="+ Add subitem" aria-label="Add subitem"></td></tr>` : '';
    return `<div class="tablewrap" style="border-radius:14px"><table class="board subtable-edit"><thead><tr><th class="name-cell" style="min-width:220px">Subitem</th>${sc.map(c => `<th class="w-${c.type}">${esc(c.title)}</th>`).join('')}</tr></thead><tbody>${rows}${add}</tbody></table></div>`;
  }
  function setSub(itemId, subId, colId, value) {
    const b = board(), item = itemById(itemId); if (!b || !item) return;
    if (!S.canWrite) { toast(S.isGuest ? 'Guests can’t change subitems.' : 'You can view this board but not change it.'); scheduleRender(); return; }
    const subs = JSON.parse(JSON.stringify(item.subitems || [])); const sb = subs.find(x => String(x.id) === String(subId)); if (!sb) return;
    const was = JSON.parse(JSON.stringify(sb)), lines = [], ran = [];
    if (colId === 'name') { if (!value || value === sb.name) return; sb.name = value; }
    else {
      const c = (b.subColumns || []).find(x => x.id === colId); if (!c) return;
      if (!colEditable(c, b)) { toast(`${c.title} is locked. Only admins can change it.`); scheduleRender(); return; }
      if (c.type === 'number' && value !== '') value = Number(String(value).replace(/[^0-9.\-]/g, ''));
      if (String((sb.values || {})[colId] ?? '') === String(value ?? '')) return;
      sb.values = { ...(sb.values || {}), [colId]: value };
      lines.push(`Subitem “${sb.name}”: ${c.title} → ${describe(c, value)}`);
      // subitem rules: same lock policy as item rules (a column the person can't change is skipped and logged)
      rulesOf(b).filter(r => r.trigger === 'sub_status' && r.col === colId && (r.value == null || String(r.value) === String(value))).forEach(r => {
        const texts = [];
        (r.actions || []).forEach(a => { const tc = (b.subColumns || []).find(x => x.id === a.col); if (!tc || !['set_date', 'set_status', 'set_value', 'clear'].includes(a.type)) return;
          if (!colEditable(tc, b)) { texts.push(`skipped: ${tc.title} is locked for ${meName()}`); lines.push(`“${r.title}” skipped: ${tc.title} is locked for ${meName()}`); return; }
          if (a.type === 'set_date') sb.values[tc.id] = ymdPlus(a.offset); else if (a.type === 'clear') sb.values[tc.id] = ''; else sb.values[tc.id] = a.value;
          texts.push(`set ${tc.title} on subitem “${sb.name}”`); lines.push(`“${r.title}” set ${tc.title} on subitem “${sb.name}”`); });
        ran.push({ rule: r, texts });
      });
    }
    item.subitems = subs; const added = lines.map(t => ({ at: now(), by: t.startsWith('“') ? 'automation' : S.uid, text: t })).reverse();
    item.activity = [...added, ...(item.activity || [])].slice(0, 40);
    // only this subitem's changed fields go to the server, merged by id into what's stored (a stale list never overwrites others)
    const change = { id: sb.id }; if (sb.name !== was.name) change.name = sb.name;
    const vals = {}; for (const [k, v] of Object.entries(sb.values || {})) if (JSON.stringify(v ?? '') !== JSON.stringify((was.values || {})[k] ?? '')) vals[k] = v;
    if (Object.keys(vals).length) change.values = vals;
    let saved = false; const p = 'boards/' + b.id + '/items/' + item.id;
    write(p, () => S.db.doc(p).update({ $set: { subitems: [change] }, ...(added.length ? { $append: { activity: added } } : {}) }).then(r => { saved = true; return r; })).then(() => { if (saved && window.SolverExt) ran.forEach(x => SolverExt.ruleRan(b, item, x.rule, x.texts)); });
    scheduleRender();
  }
  function savePage() { try { localStorage.setItem('ks-page', S.page); localStorage.setItem('ks-view', S.view); } catch (e) {} }
  let summaryBusy = false;
  async function loadSummary(force) {
    if (!window.KS || !S.ws || summaryBusy) return;
    if (!force && S.summary && S.summary.ws === S.ws) return;
    summaryBusy = true;
    try { S.summary = await KS.summary(S.ws); } catch (e) {}
    summaryBusy = false;
    if (S.page === 'home') renderContent();
  }
  function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }
  function sparkSvg(vals) {
    const w = 120, h = 38, max = Math.max(1, ...vals), step = w / (vals.length - 1);
    const pts = vals.map((v, i) => [i * step, h - 4 - (v / max) * (h - 10)]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const last = pts[pts.length - 1];
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#sg)"/><path d="${d}" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="#fff"/></svg>`;
  }
  function ringSvg(frac) {

    return `<svg class="ring" viewBox="0 0 104 104" aria-hidden="true"><circle cx="52" cy="52" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="7"/><circle cx="52" cy="52" r="${r}" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 52 52)" style="filter:drop-shadow(0 0 6px rgba(255,255,255,.45))"/><text x="52" y="57" text-anchor="middle" fill="#fff" font-size="17" font-weight="500" font-family="-apple-system, system-ui, sans-serif">${Math.round(frac * 100)}%</text></svg>`;
  }
  function renderHome() {
    loadSummary(false);
    const first = String((S.me && S.me.name) || '').split(/\s+/)[0];
    const name = first && !/^your$/i.test(first) ? first : '';
    const wsName = (workspaces().find(w => w.id === S.ws) || {}).name || 'your workspace';
    const sm = S.summary && S.summary.ws === S.ws ? S.summary : null;
    const motionOk = (() => { let m = 'full'; try { m = localStorage.getItem('ks-motion') || 'full'; } catch (e) {} return m !== 'off' && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); })();
    const top = `<div class="home-top home-hero"><video class="hero-vid" muted loop playsinline ${motionOk ? 'autoplay' : ''} preload="auto" poster="/media/home-banner.jpg" src="/media/home-banner.mp4" aria-hidden="true"></video><div class="hero-coin" aria-hidden="true"><div class="coin3d">${Array.from({ length: 10 }, (_, k) => `<i class="coin-edge" style="--z:${(k - 4.5) * 0.9}px"></i>`).join('')}<b class="coin-face front"><span class="c-val">19<small>¢</small></span><span class="c-ring"></span></b><b class="coin-face back"><span class="c-val">$</span><span class="c-ring"></span></b></div><div class="coin-shadow"></div></div><div class="hero-in"><p class="eyebrow">${esc(new Date().toLocaleDateString('en-CA', { weekday: 'long', month: 'long', day: 'numeric' }))}</p><h1>${greeting()}${name ? ', ' + esc(name) : ''}</h1><p class="hero-quote" aria-live="polite">${esc(heroQuote())}</p>${S.isGuest ? '<span class="pill guest-badge">Guest</span>' : ''}</div><div style="display:flex;gap:10px">${fx('homeTop') || ''}<button class="icon-round" data-act="sheet-profile" aria-label="Menu">${IC.menu}</button></div></div>`;
    if (!sm) return `<div class="home">${top}<div class="glass hero"><p class="home-skel">Adding up ${esc(wsName)}…</p></div></div>`;
    const f = sm.followups, dueAll = f.overdue + f.dueToday + f.upcoming;
    const onTrack = dueAll ? (f.dueToday + f.upcoming) / dueAll : 1;
    const list = sm.boards.slice(0, 5).map(x => `<button class="li" data-act="board" data-id="${esc(x.id)}"><span class="li-ic">${esc(initials(x.name))}</span><span class="li-main"><b>${esc(x.name)}</b><span>${x.newWeek ? '+' + x.newWeek.toLocaleString('en-CA') + ' this week' : (x.folder ? esc(x.folder) : 'Board')}</span></span><span class="li-val">${x.count.toLocaleString('en-CA')}</span><span class="chev">›</span></button>`).join('');
    return `<div class="home">${top}
      <section class="glass hero" aria-label="Total items">
        <div class="hero-label"><span>Total leads · ${esc(wsName)}</span></div>
        <div class="hero-num">${sm.total.toLocaleString('en-CA')}</div>
        <div class="hero-sub"><span class="delta">${sm.newWeek ? '↑ ' + sm.newWeek.toLocaleString('en-CA') + ' new this week' : 'No new items this week'}</span>${sparkSvg(sm.spark)}</div>
      </section>
      <div class="quick">
        <button class="qa" data-act="quick-new"><span class="qa-ic">${IC.plus}</span>New lead</button>
        <button class="qa" data-act="go-calendar"><span class="qa-ic">${IC.cal}</span>Follow-ups</button>
        <button class="qa" data-act="sheet-boards"><span class="qa-ic">${IC.more}</span>More</button>
      </div>
      <div class="home-boards"><div class="sec"><h2>Boards</h2>${sm.boards.length > 5 ? `<button data-act="sheet-boards">See all ${sm.boards.length}</button>` : ''}</div>
      <div class="glass list">${list || '<p class="home-skel">No boards yet.</p>'}</div></div>
      <div class="home-fu"><div class="sec"><h2>Follow-ups</h2></div>
      <section class="glass ov">
        <div class="ov-main"><div class="k">Due in the next 7 days</div><div class="v">${(f.dueToday + f.upcoming).toLocaleString('en-CA')}</div>
          <div class="ov-rows"><span><span>Due today</span><b>${f.dueToday.toLocaleString('en-CA')}</b></span><span><span>Overdue</span><b>${f.overdue.toLocaleString('en-CA')}</b></span></div></div>
        ${ringSvg(onTrack)}

    </div>`;
  }
  function renderNav() {
    const nav = $('#bnav'); if (!nav) return;
    const cur = S.page === 'home' ? 'home' : S.page === 'dash' ? 'dash' : S.view === 'calendar' ? 'cal' : 'boards';
    const btn = (k, act, label, ic) => `<button data-act="${act}" aria-current="${cur === k}" aria-label="${label}">${ic}<span>${label}</span></button>`;
    nav.innerHTML = btn('home', 'go-home', 'Home', IC.home) + btn('boards', 'sheet-boards', 'Boards', IC.boards)

      + btn('cal', 'go-calendar', 'Calendar', IC.cal) + btn('me', 'sheet-profile', 'Profile', `<span class="nwrap">${IC.user}${S.notifs.unread ? `<span class="nbadge">${S.notifs.unread > 9 ? '9+' : S.notifs.unread}</span>` : ''}</span>`);
  }

  if (window.KSViews) KSViews.init({ S, board, itemById, visibleItems, labelOf, splitPeople, fileList, isFileCol, describe, colEditable, setValue, patchItem, patchBoard, localBoard, formulaResult, hue, initials, toast, render, renderHead, renderContent, renderLayer, savePage });
  // the page's internals the add-ons use (ext.js, automations.js, editor.js, extras.js)
  Object.assign(window.SolverApp = window.SolverApp || {}, { S, board, itemById, patchBoard, patchItem, localBoard, render, renderLayer, renderContent, scheduleRender, toast, esc, rid, normRule, describe, labelOf, fmtTime, splitPeople, colEditable, isLocked, fillNames, IC });

  async function init() {
    render();
    if (!(window.claude && window.claude.use)) { S.status = 'offline'; render(); return; }
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db) { S.status = 'offline'; render(); return; }
    S.db = db; S.user = user;
    if (user) {

      try { const c = await user.can('data.write'); if (c === false) S.canWrite = false; } catch (e) {}
    }
    checkImport();
    if (window.KS) KS.users().then(l => { S.team = l; S.teamNames = l.filter(u => !u.disabled).map(u => u.name); }).catch(() => {});
    if (window.KS) {
      loadNotifs();
      window.SolverOpen = (bid, iid) => { if (!S.boards.some(x => x.id === bid)) { toast('That board isn’t available to you.'); return; } S.modal = null; S.page = 'board'; S.view = 'table'; savePage(); selectBoard(bid); if (iid) { if (S.itemsLoaded && itemById(iid)) { S.openItem = iid; S.drawerTab = 'updates'; } else S.pendingOpen = iid; } render(); };
      window.SolverMe = () => ({ id: S.uid, name: (S.me && S.me.name) || '', homeBoard: (S.me && S.me.homeBoard) || '', ws: S.ws, boards: S.boards.map(b => ({ id: b.id, name: b.name })) });
      KS.on('notify', n => { if (S.notifs.items.some(x => x.id === n.id)) return; S.notifs.items.unshift(n); S.notifs.unread++; toast(n.text.length > 110 ? n.text.slice(0, 108) + '…' : n.text); renderRail(); renderNav(); if (S.modal && ['notifs', 'profile'].includes(S.modal.type)) renderLayer(); });
      KS.on('reconnect', loadNotifs);

    const slow = setTimeout(() => { if (S.status === 'loading') { S.status = 'slow'; render(); } }, 10000);
    db.collection('boards').onSnapshot(snap => {
      S.boards = snap.docs.map(d => ({ id: d.id, ...structuredClone(d.data()) })).sort((a, b) => (a.order || 0) - (b.order || 0));
      if (!snap.metadata.fromCache) { S.status = 'ready'; clearTimeout(slow); }
