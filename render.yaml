# Render Blueprint for Solver.ca (the app lives in solver/).
# Render dashboard > New > Blueprint > pick this repo. Fill in the four values marked sync: false.
services:
  - type: web
    name: solver-crm
    runtime: docker
    dockerfilePath: ./solver/Dockerfile   # paths are from the repo root
    dockerContext: ./solver
    plan: starter            # persistent disks need a paid instance
    region: oregon
    branch: claude/dreamy-hamilton-i65yx7
    healthCheckPath: /healthz
    disk:
      name: solver-data
      mountPath: /data       # solver.db lives here; Render snapshots disks daily
      sizeGB: 2
    envVars:
      - key: COOKIE_SECURE
        value: "1"
      - key: MONDAY_WORKSPACE_IDS
        # MortgageSolver CRM, Admin (trustee boards), Carl, Mariel, Cath, Jerico, Adrian, K&D, Michael, Krissia
        value: "11508737,7066043,7749105,7500872,6052089,9005040,12791794,6163139,13069785,9342139"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MONDAY_API_TOKEN
        sync: false
